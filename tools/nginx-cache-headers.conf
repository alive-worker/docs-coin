# Recommended Cache-Control & compression headers for coin.ponr.org (include inside the server {} block).
# Purpose:
#   1. Eliminate frequent Cloudflare REVALIDATED origin round-trips (~1s TTFB penalty) on HTML pages
#      using s-maxage + stale-while-revalidate.
#   2. Cache hash-versioned static assets (styles.css?v=..., js/site.js?v=...) and immutable SVGs/PNGs
#      for 1 year so browsers and Cloudflare never revalidate them.

# HTML pages & feeds: short browser TTL, longer CDN TTL, serve stale while revalidating in background
location ~* \.(?:html|xml)$ {
    add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400" always;
}

# Exact root / directory index URLs (/ , /en/ , /research/<topic>/)
location ~* /$ {
    add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400" always;
}

# Hash-versioned CSS/JS & static media: immutable 1-year cache
location ~* \.(?:css|js|svg|png|ico|webp|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
