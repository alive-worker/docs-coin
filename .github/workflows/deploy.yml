name: Deploy to production

# Manual fallback only — routine deploys are handled by a cron job on the server
# (check-and-deploy-docs-coin.sh) that polls origin/main every minute, avoiding
# Actions minutes usage on every push.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /root/deploy-docs-coin.sh
