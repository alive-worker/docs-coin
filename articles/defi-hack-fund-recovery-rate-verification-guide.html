<title>页面已迁移：DeFi黑客攻击资金追回率核验：「资金已归还」的报道，真实追回比例是多少 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="每当一起大额DeFi黑客攻击发生后，媒体经常会跟进报道&quot;黑客同意归还部分资金&quot;或&quot;白帽介入协助追回&quot;，给人一种资金损失最终会被大部分挽回的印象。但把历史上全部黑客事件的真实追回数据摊开统计，会发现整体追回率远低于这种叙事给人的直觉。本文用DefiLlama公开抓取的真实黑客事件数据库，拆解如何核验一起具体事件的追回进展，以及为什么不能用个别高调案例去推断整体追回率。仅供学习研究，不构成投资建议。">
