<meta name="description" content="交易所自己公布的24小时成交量数字里，混入了大量做市商互刷、机器人自成交等虚假交易，第三方数据平台会用信任评分(Trust Score)对成交量做「归一化」处理，把虚假流动性剔除。本文以CoinGecko公开的真实评分数据为例，拆解信任评分的构成维度、归一化成交量与官方公布数字的差距、以及如何核验一家交易所的评分是否真的反映其真实流动性。仅供学习研究，不构成投资建议。">
