<title>页面已迁移：空投快照区块选择核验：项目方挑一个「合适」的区块高度，能操纵多少分配结果 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="几乎每次空投公告都会宣布一个具体的快照区块高度或时间点，用于确定哪些地址、按什么数量有资格领取代币。这个快照本身常被视为客观、不可篡改的链上事实，但核验者很少追问：这个具体区块高度是如何被选定的、选定过程是否提前公开、项目方是否有能力在结果已知的情况下事后选择对自己或关联方更有利的区块。本文拆解空投快照机制的设计原理、区块高度选择权可能被滥用的几种具体路径、常见的时间线操纵手法，以及一套用于核验一次空投快照公正性的框架。仅供学习研究，不构成投资建议。">
