<title>页面已迁移：治理投票权快照操纵核验：为什么用来投票的代币数量，只在「那一个区块」作数 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="DAO治理提案的投票权重通常由某一个特定区块高度的代币余额快照决定，而不是投票当下的实时余额。这个设计本意是防止重复投票，却也留下了「在快照那一刻临时拉高持仓」的操纵窗口。本文拆解快照机制的本质、闪电贷/临时借贷拉升投票权的可行性核验、委托投票与跨链代币重复计票等隐藏风险，并给出跨协议反操纵机制核验框架。仅供学习研究，不构成投资建议。">
