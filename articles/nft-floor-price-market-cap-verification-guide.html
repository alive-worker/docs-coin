<meta name="description" content="NFT交易平台展示的「地板价」(floor price)是该系列当前挂单价格最低的一件，市值则是地板价乘以总供应量得出的理论数字，但这两个指标都存在系统性的解读陷阱——地板价可以被极小额挂单操纵，市值假设整个系列能同时以地板价卖出，这个假设在现实中几乎不成立。本文用CoinGecko公开抓取的真实NFT数据，拆解地板价与真实成交均价之间的差距，以及如何核验一个NFT系列的市值数字是否有意义。仅供学习研究，不构成投资建议。">
