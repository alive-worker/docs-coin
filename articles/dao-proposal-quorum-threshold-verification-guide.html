<title>页面已迁移：DAO提案法定人数核验：超六成提案根本没有设置quorum门槛 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="加密媒体报道&quot;某DAO提案高票通过&quot;时，很少说明这个提案是否设置了法定人数(quorum)门槛，也很少区分投票人数(votes)和加权投票值(scores_total)这两个完全不同的数字——一个提案哪怕只有3个钱包地址参与投票，只要没有quorum门槛限制，就可以合法通过并执行，而报道展示的动辄数千万甚至数十亿的&quot;加权得分&quot;，可能只是极少数大户钱包的持仓换算结果。本文用Snapshot公开抓取的真实DAO提案数据，拆解如何核验一个&quot;高票通过&quot;的提案背后真实的参与门槛与投票人数。仅供学习研究，不构成投资建议。">
