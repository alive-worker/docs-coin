<title>页面已迁移：DeFi板块市值核验：说DeFi板块涨跌时，这个指数可能被一枚代币主导 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="加密媒体报道&quot;DeFi板块市值今日上涨X%&quot;时，很容易让人以为这是整个DeFi生态普遍活跃的信号，但这个所谓的&quot;DeFi板块市值&quot;本质上是数据平台按代币分类标准汇总出的一个加权指数，而这个指数的权重分布可能高度集中——如果单一代币占据了这个指数五分之一以上的权重，那么这枚代币自身的价格波动就足以主导整个&quot;板块&quot;的涨跌，与其余上百个DeFi代币的真实表现关系不大。本文用CoinGecko公开抓取的真实DeFi板块市值构成数据，拆解如何核验一个&quot;DeFi板块&quot;涨跌说法背后真实的权重集中度。仅供学习研究，不构成投资建议。">
