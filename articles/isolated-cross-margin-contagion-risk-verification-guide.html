<title>页面已迁移：逐仓与全仓保证金核验：一个仓位爆仓，会不会传染到你账户里的其他仓位 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="几乎所有合约交易所都提供「逐仓」和「全仓」两种保证金模式供用户选择，官方说明通常会强调逐仓模式下亏损被隔离在单一仓位内，不会波及账户其他资产。但很少有用户真正核验过这句话在自己交易所的具体实现里是否完全成立——保证金隔离的边界、追加保证金机制与自动减仓的触发顺序、以及极端行情下交易所风控系统实际执行的先后逻辑，都可能让「隔离」这个词的实际含义打折扣。本文拆解逐仓与全仓保证金模式的本质区别、保证金隔离在实践中可能出现缺口的几种具体场景，以及一套用于核验一个交易所保证金隔离机制是否真正可靠的框架。仅供学习研究，不构成投资建议。">
