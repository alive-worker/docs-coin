<title>页面已迁移：比特币历史波动率与隐含波动率核验：媒体说的「波动率飙升」，指的是哪一种 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="加密媒体报道&quot;比特币波动率飙升&quot;时，很少说明这个&quot;波动率&quot;具体是指哪一种——历史波动率(HV)是根据过去一段时间实际价格变化计算出的回顾性指标，隐含波动率(IV)则是从期权价格反推出的、市场对未来波动的预期，两者可以在同一时刻朝相反方向变化。本文用Deribit公开抓取的真实历史波动率数据，拆解如何核验一篇报道说的究竟是哪种波动率，以及两者背离时分别意味着什么。仅供学习研究，不构成投资建议。">
