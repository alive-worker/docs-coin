<title>页面已迁移：预言机中位数聚合核验：少数几个喂价源被操纵，中位数真的稳如泰山吗 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="很多预言机网络都宣称采用「中位数」而非「平均数」来聚合多个独立节点的报价，因为中位数在统计学上被认为对极端离群值不敏感，理论上单个节点被操纵不会显著扭曲最终喂价。这个统计学性质本身是正确的，但核验者很少追问它成立的具体前提：节点总数有多少、这个前提在实际的节点数量和分布下是否依然成立、以及「多个节点」在链下基础设施层面是否真的相互独立。本文拆解中位数聚合机制的统计学原理与边界条件、几种可能让中位数防御失效的具体场景、节点数量与操纵成本的关系，以及一套用于核验一个预言机中位数聚合机制真实抗操纵能力的框架。仅供学习研究，不构成投资建议。">
