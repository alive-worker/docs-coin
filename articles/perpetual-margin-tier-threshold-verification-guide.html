<meta name="description" content="交易所永续合约页面通常只展示一个「最高杠杆」数字，但实际可用杠杆和维持保证金率(MMR)会随仓位名义价值分层递减/递增，仓位规模刚跨过一个门槛，最大杠杆瞬间被下调、维持保证金率同时上调，很多交易者直到被部分强平才发现。本文以真实分级表为例，给出一套核验方法：读懂分级表结构、算出跨档瞬间的保证金缺口、核实交易所是否会临时调整分级。仅供学习研究，不构成投资建议。">
