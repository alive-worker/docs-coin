<title>页面已迁移：DAO国库多元化提案：把单一代币换成稳定币，审批链条卡在哪一步 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="当DAO国库的绝大部分资产是自己发行的原生代币时，「多元化」——卖出部分原生代币换成稳定币或其他资产——听起来是显而易见的风险管理常识，但这个看似简单的提案往往在治理流程里卡住，或者执行方式与投票通过的内容存在明显偏差。本文拆解国库多元化提案要经过的具体审批链条、执行阶段的市场冲击与信息不对称风险、以及场外交易与做市商中介带来的隐藏对手方风险，并给出跨DAO横向对比框架。仅供学习研究，不构成投资建议。">
