<title>页面已迁移：Rollup排序器MEV提取核验：交易排序权到底能被用来拿走用户多少价值 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="大多数Rollup的排序器（sequencer）拥有决定用户交易在一个区块内先后顺序的完全权力，这个权力本身是可以直接变现的——通过插入、重排或延迟特定交易，排序器运营方能够提取三明治攻击、抢跑套利等形式的最大可提取价值（MEV），而这部分收益的去向、规模与分配方式，很少被用户认真核验过。本文拆解排序器MEV提取的具体机制、常见的收益分配与披露模式、几种用于判断排序器是否存在选择性提取的核验方法，以及一套跨Rollup横向核验框架。仅供学习研究，不构成投资建议。">
