<meta name="description" content="几乎每个提供合约交易的加密交易所都会宣传自己设有「保险基金」，用来在穿仓爆仓时兜底、避免自动减仓伤及正常盈利用户。但保险基金的规模、资金来源、补充机制和真实覆盖率，往往只在官网一个数字页面里一笔带过，很少有用户认真核验过这笔钱在极端行情下到底够不够用。本文拆解保险基金的运作原理、常见的规模测算误区、资金枯竭后交易所的几种应对方式，以及一套跨交易所横向核验框架。仅供学习研究，不构成投资建议。">
