<meta name="description" content="DeFi借贷协议界面展示的一个总APY数字，通常是「基础利息收益率」和「代币奖励收益率」两部分加总而成，但两者的可持续性和真实价值天差地别——基础利息来自借款人真实支付的利息，代币奖励的价值取决于该代币未来能否维持当前市价。本文用DefiLlama公开抓取的真实协议收益率数据，拆解如何核验一个APY数字里两部分的具体占比，以及代币奖励部分隐藏的真实风险。仅供学习研究，不构成投资建议。">
