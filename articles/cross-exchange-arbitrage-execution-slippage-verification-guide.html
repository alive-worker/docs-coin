<title>页面已迁移：跨交易所搬砖套利核验：报价和实际成交之间，滑点吃掉了多少利润 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="跨交易所价差套利（搬砖）常被描述成一种低风险、甚至「无脑」的盈利策略：只要两个交易所之间存在价差，同时买低卖高就能锁定利润。但这个叙事默认了一个关键前提——报价即成交价，而现实中从发现价差到两笔订单分别成交，中间存在的执行延迟、滑点、提现到账时间和手续费，往往会侵蚀掉大部分甚至全部的理论利润。本文拆解搬砖套利的完整执行链条、报价利润与净利润之间的具体差距来源、几种容易被忽视的隐性成本，以及一套用于核验一笔搬砖策略真实可行性的框架。仅供学习研究，不构成投资建议。">
