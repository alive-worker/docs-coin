<meta name="description" content="买入现货、同时做空等值期货锁定基差，常被包装成「无风险套利」，年化收益写着两位数。但这笔交易真正无风险的前提，只有在两条腿能同时、完整、按预期价格执行的理想情况下才成立。本文拆解基差交易的收益来源、保证金与强平的不对称风险、跨交易所执行的时间差敞口，以及交割/展期环节容易被忽视的隐性成本。仅供学习研究，不构成投资建议。">
