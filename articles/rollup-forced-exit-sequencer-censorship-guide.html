<meta name="description" content="「资产托管在L1、执行在L2」这句话成立的前提，是当排序器拒绝打包你的交易或者直接宕机时，你仍然有办法把资产要回来。这个安全阀就是强制退出机制，但它的实际有效性取决于强制包含延迟窗口有多长、退出证明周期是否会被审查本身卡住，以及L1拥堵时这条退出路径是否还走得通。本文拆解强制退出机制的设计原理、核验方法与常被忽视的隐藏风险，并给出跨Rollup横向对比框架。仅供学习研究，不构成投资建议。">
