<title>页面已迁移：稳定币市值占比核验：这个「入场资金」信号，计算口径藏着什么陷阱 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="稳定币占加密货币总市值的比例，经常被媒体和分析师当作「场外待入场资金」规模的代理指标——占比上升被解读为看涨信号，占比下降被解读为资金离场。但这个指标的计算口径本身存在多个容易被忽略的陷阱。本文用CoinGecko公开抓取的真实市值数据，拆解稳定币占比指标的构成、算法稳定币与法币抵押稳定币的口径差异，以及如何核验这个数字是否真的代表可入场资金。仅供学习研究，不构成投资建议。">
