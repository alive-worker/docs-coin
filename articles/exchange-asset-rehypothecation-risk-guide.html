<title>页面已迁移：交易所资产再抵押风险：你存的币，可能正被借给别人用 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="把币存进交易所现货账户，看起来只是一次简单的托管，但很多交易所的服务条款里都写着一句容易被忽略的话：平台有权将用户资产用于借贷、做市或其他业务活动。这意味着你账户里显示的余额，背后对应的原生资产可能已经被出借给了第三方，一旦借出方出现问题，你的提现请求可能无法被及时满足。本文拆解再抵押条款的具体措辞、储备证明为什么无法完全排除再抵押风险、以及核验交易所是否存在再抵押行为的实操方法。仅供学习研究，不构成投资建议。">
