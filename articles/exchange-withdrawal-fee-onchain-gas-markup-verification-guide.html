<title>页面已迁移：交易所提现手续费核验：官网收的固定费用，比链上真实Gas贵了多少倍 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="几乎每个交易所都会公示一份提现手续费表，按币种列出每次提现需要支付的固定金额。用户通常默认这笔费用大致对应交易所支付的链上Gas成本，但很少有人真的去核对：这笔固定费用和实际执行那笔链上转账所消耗的Gas，差距到底有多大。本文拆解交易所提现手续费的定价逻辑、如何用公开区块浏览器数据独立核算一笔提现的真实Gas成本、加价倍数在不同网络拥堵程度下的变化规律，以及一套用于横向核验多个交易所提现费率合理性的方法。仅供学习研究，不构成投资建议。">
