<title>页面已迁移：预言机断路器核验：价格剧烈偏离时，喂价真的会暂停吗 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="很多借贷协议和衍生品协议都宣称接入了「断路器」（circuit breaker）机制，用来在预言机报价出现异常剧烈波动时暂停清算或喂价更新，防止闪电崩盘或喂价源被操纵时引发连环错误清算。但断路器的具体触发阈值、暂停后的处理逻辑、以及它和预言机本身故障之间的边界，很少被用户认真核验过。本文拆解断路器机制的设计原理、常见的阈值设置误区、暂停期间协议的几种处理路径，以及一套跨协议横向核验框架。仅供学习研究，不构成投资建议。">
