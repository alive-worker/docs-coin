<title>页面已迁移：交易所SOC 2审计核验：那份「已通过安全审计」的报告，到底审计了什么 - 加密货币研究（内容已整体移至新地址）</title>
<meta name="description" content="越来越多交易所把「已通过SOC 2审计」作为安全性的核心宣传点，附上一份看起来专业、正式的审计报告链接或徽章。但SOC 2本质上是一套通用的企业信息安全合规框架，最初为传统SaaS和云服务商设计，并不是专门针对加密货币托管场景开发的标准。核验者很少追问的问题是：这份报告具体审计的是哪几项控制目标、审计类型是Type I还是Type II、审计范围是否覆盖了热钱包私钥管理这类加密行业特有的核心风险，还是仅仅覆盖了访问控制、变更管理这类通用IT流程。本文拆解SOC 2审计框架的基本结构、Type I与Type II的关键区别、审计范围披露中常见的信息缺口，以及一套用于核验一份交易所SOC 2报告实际含金量的框架。仅供学习研究，不构成投资建议。">
