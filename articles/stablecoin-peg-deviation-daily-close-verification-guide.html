<meta name="description" content="加密媒体报道&quot;某稳定币短暂脱锚&quot;时，很少说明这个脱锚幅度是按日线收盘价计算的，还是按盘中最低成交价计算的——同一枚稳定币在同一天，日线收盘偏离可能只有几个基点，但盘中某一分钟的极端偏离可能达到日线数据的十倍以上，两种统计口径反映的风险完全不是一回事。本文用CoinGecko公开抓取的真实USDC与USDT过去90天日线价格数据，拆解如何核验一篇脱锚报道具体引用的是哪种统计口径，以及日线数据为什么会系统性掩盖盘中的短暂脱锚。仅供学习研究，不构成投资建议。">
