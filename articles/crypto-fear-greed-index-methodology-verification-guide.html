<meta name="description" content="恐惧贪婪指数(Fear&Greed Index)几乎是加密媒体引用率最高的单一数字，一个0-100的分数被简化成「市场恐慌」或「市场贪婪」的结论，但极少有报道说明这个分数由哪些维度加权合成、各维度权重是多少、以及为什么同一个数字在不同数据源之间可能不一致。本文用Alternative.me公开抓取的真实历史数据，拆解指数的构成方法论、核验陷阱与横向对比方法。仅供学习研究，不构成投资建议。">
