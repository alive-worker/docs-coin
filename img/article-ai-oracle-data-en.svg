<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI oracles and trusted on-chain data cover image">
  <defs>
    <radialGradient id="orGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#4fd1c5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <linearGradient id="orFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f8fd9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fd1c5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </linearGradient>
    <filter id="orSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="orDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#orDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#4fd1c5"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research · AI × On-Chain (2)</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#4fd1c5">AI Oracle · Trusted On-Chain Data</text>

  <!-- off-chain unstructured inputs on the left -->
  <g transform="translate(150,300)" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#c9d3e0" text-anchor="middle">
    <g fill="#111820" stroke="url(#orEdge)" stroke-width="2">
      <rect x="-58" y="-150" width="116" height="52" rx="10"/>
      <rect x="-58" y="-26" width="116" height="52" rx="10"/>
      <rect x="-58" y="98" width="116" height="52" rx="10"/>
    </g>
    <text x="0" y="-120">Text / News</text>
    <text x="0" y="4">Image / Event</text>
    <text x="0" y="128">Result / Filing</text>
  </g>

  <!-- data flow lines into the model -->
  <g stroke="url(#orFlow)" stroke-width="3" fill="none">
    <path d="M208 176 C 360 176 420 280 560 296"/>
    <path d="M208 300 C 380 300 420 300 560 300"/>
    <path d="M208 424 C 360 424 420 320 560 304"/>
  </g>

  <!-- central AI oracle model core -->
  <g transform="translate(640,300)" filter="url(#orSoft)">
    <circle r="150" fill="url(#orGlow)" opacity="0.7"/>
    <rect x="-70" y="-70" width="140" height="140" rx="24" fill="#0d1b1a" stroke="#4fd1c5" stroke-width="3"/>
    <g stroke="url(#orEdge)" stroke-width="1.5" opacity="0.75">
      <line x1="-40" y1="-34" x2="40" y2="-34"/>
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="-40" y1="34" x2="40" y2="34"/>
      <line x1="-40" y1="-34" x2="0" y2="0"/>
      <line x1="40" y1="-34" x2="0" y2="0"/>
      <line x1="-40" y1="34" x2="0" y2="0"/>
      <line x1="40" y1="34" x2="0" y2="0"/>
    </g>
    <g fill="#4fd1c5">
      <circle cx="-40" cy="-34" r="6"/><circle cx="40" cy="-34" r="6"/>
      <circle cx="-40" cy="0" r="6"/><circle cx="40" cy="0" r="6"/>
      <circle cx="-40" cy="34" r="6"/><circle cx="40" cy="34" r="6"/>
      <circle cx="0" cy="0" r="8"/>
    </g>
    <text x="0" y="-88" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#4fd1c5" text-anchor="middle">AI Oracle</text>
  </g>

  <!-- output to chain block on the right -->
  <g stroke="url(#orFlow)" stroke-width="3" fill="none">
    <path d="M712 300 C 820 300 860 300 936 300"/>
  </g>
  <g transform="translate(1010,300)">
    <rect x="-66" y="-58" width="132" height="116" rx="16" fill="#111820" stroke="url(#orEdge)" stroke-width="2.5"/>
    <g stroke="#4fd1c5" stroke-width="2" opacity="0.55">
      <line x1="-66" y1="-20" x2="66" y2="-20"/>
      <line x1="-66" y1="20" x2="66" y2="20"/>
    </g>
    <text x="0" y="-30" font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#4fd1c5" text-anchor="middle">on-chain</text>
    <text x="0" y="8" font-family="'Consolas',monospace" font-size="12" fill="#c9d3e0" text-anchor="middle">result = ?</text>
    <text x="0" y="42" font-family="'Consolas',monospace" font-size="12" fill="#7f8aa3" text-anchor="middle">verify()</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#4fd1c5">When a model produces "truth"</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">who verifies it: non-reproducibility, single points &amp; backstops</text>
</svg>
