<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="en-cover">
  <rect width="1200" height="600" fill="#07140f"/>
  <g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif">
    <text x="72" y="64" fill="#6de8ac" font-size="16" letter-spacing="2.2">PROTOCOL / GAS</text>
    <text x="72" y="122" fill="#f3fff8" font-size="40" font-weight="700">The cap is not the price</text>
    <text x="72" y="168" fill="#b7d8c8" font-size="20">Of a cap of 50, the receipt pays 14.</text>
    <text x="204.8" y="248" fill="#d7ffef" font-size="18" text-anchor="middle">Burned 12</text>
    <text x="387.2" y="248" fill="#8fb9a6" font-size="18">Tip 2, then unused cap</text>
  </g>
  <rect x="80" y="268" width="1040" height="108" rx="16" fill="none" stroke="#24584a" stroke-width="3"/>
  <rect x="80" y="268" width="249.6" height="108" rx="16" fill="#0f6e56"/>
  <rect x="329.6" y="268" width="41.6" height="108" fill="#6de8ac"/>
  <g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif">
    <text x="204.8" y="332" fill="#e9fff6" font-size="22" text-anchor="middle">12</text>
    <text x="371.2" y="418" fill="#6de8ac" font-size="18">Paid 14</text>
    <text x="1120" y="418" fill="#8fb9a6" font-size="18" text-anchor="end">Cap 50</text>
  </g>
</svg>