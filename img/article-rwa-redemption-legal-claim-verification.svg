<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="代币烧毁后，剩下的是权利还是承诺 主题配图">
  <defs>
    <radialGradient id="rrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rrEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#e0b25e"/>
    </linearGradient>
    <filter id="rrSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rrDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#rrDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · RWA 系列</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">代币烧毁 · 赎回法律追索权核验</text>

  <!-- a token dissolving into particles that flow toward a contract/document icon, with a scale of justice and a locked vault marked with a question mark -->
  <g transform="translate(600,300)" filter="url(#rrSoft)">
    <circle r="210" fill="url(#rrGlow)" opacity="0.7"/>

    <!-- left: burning/dissolving token -->
    <g transform="translate(-270,0)">
      <circle r="46" fill="none" stroke="#5ec8e0" stroke-width="4" opacity="0.9"/>
      <text x="0" y="9" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#5ec8e0" text-anchor="middle">T</text>
      <circle cx="58" cy="-30" r="3" fill="#5ec8e0" opacity="0.8"/>
      <circle cx="72" cy="-8" r="2.4" fill="#5ec8e0" opacity="0.6"/>
      <circle cx="66" cy="18" r="2" fill="#5ec8e0" opacity="0.45"/>
      <circle cx="50" cy="40" r="1.6" fill="#5ec8e0" opacity="0.3"/>
      <circle cx="30" cy="54" r="1.2" fill="#5ec8e0" opacity="0.18"/>
    </g>

    <!-- dissolving trail linking token to the document -->
    <path d="M -216 -6 C -120 -30, -40 -10, 20 -4" fill="none" stroke="#5ec8e0" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.6"/>

    <!-- center: contract/document icon with a scale of justice -->
    <g transform="translate(30,-10)">
      <rect x="-46" y="-70" width="92" height="128" rx="8" fill="#111820" stroke="url(#rrEdge)" stroke-width="3"/>
      <line x1="-28" y1="-42" x2="28" y2="-42" stroke="#7f8aa3" stroke-width="3" opacity="0.55"/>
      <line x1="-28" y1="-24" x2="28" y2="-24" stroke="#7f8aa3" stroke-width="3" opacity="0.4"/>
      <line x1="-28" y1="-6" x2="10" y2="-6" stroke="#7f8aa3" stroke-width="3" opacity="0.4"/>
      <!-- scale of justice -->
      <g transform="translate(0,32)" stroke="#e0b25e" stroke-width="2.6" fill="none" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="16"/>
        <line x1="-24" y1="-14" x2="24" y2="-14"/>
        <path d="M -24 -14 L -34 4 A 12 8 0 0 0 -14 4 Z"/>
        <path d="M 24 -14 L 14 4 A 12 8 0 0 0 34 4 Z"/>
        <line x1="-13" y1="16" x2="13" y2="16"/>
      </g>
    </g>

    <!-- right: locked vault with a question mark, denoting uncertain recourse -->
    <g transform="translate(250,10)">
      <rect x="-42" y="-46" width="84" height="86" rx="10" fill="#111820" stroke="#7f8aa3" stroke-width="3" opacity="0.85"/>
      <circle r="20" fill="none" stroke="#5ec8e0" stroke-width="3" opacity="0.8"/>
      <rect x="-6" y="-2" width="12" height="14" rx="2" fill="#5ec8e0" opacity="0.8"/>
      <text x="0" y="-28" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#e0725e" text-anchor="middle">?</text>
    </g>

    <path d="M 96 -6 C 150 -6, 190 4, 208 8" fill="none" stroke="#7f8aa3" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="42" fill="#5ec8e0">烧毁之后，你手里还剩什么</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">RWA代币赎回时的法律身份与破产隔离核验方法</text>
</svg>
