    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="230" r="230" fill="url(#glowapyen2)"/>
  <g filter="url(#softapyen2)">
    <rect x="760" y="260" width="70" height="90" rx="4" fill="#d6903f"/>
    <rect x="760" y="180" width="70" height="70" rx="4" fill="#d6903f" opacity="0.5"/>
    <text x="795" y="305" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0a0a0f" text-anchor="middle" font-weight="700">base</text>
    <text x="795" y="220" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#0a0a0f" text-anchor="middle" font-weight="700">reward</text>
