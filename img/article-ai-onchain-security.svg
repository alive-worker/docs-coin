<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 时代的链上安全研究 主题配图">
  <defs>
    <radialGradient id="secGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5eead4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="secEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <pattern id="secGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#5eead4" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0f14"/>
  <rect width="1200" height="600" fill="url(#secGrid)"/>
  <rect width="1200" height="600" fill="url(#secGlow)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5eead4"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0f14" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 链上安全 系列</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5eead4">DeFi · 链上安全 · AI 辅助核验</text>
  <g transform="translate(830,300)">
    <path d="M0,-150 L120,-100 L120,40 Q120,150 0,190 Q-120,150 -120,40 L-120,-100 Z" fill="#0d1b1a" stroke="url(#secEdge)" stroke-width="2.5" opacity="0.92"/>
    <g stroke="url(#secEdge)" stroke-width="1.4" opacity="0.6">
      <line x1="-70" y1="-60" x2="70" y2="-60"/>
      <line x1="-80" y1="-10" x2="80" y2="-10"/>
      <line x1="-70" y1="40" x2="70" y2="40"/>
    </g>
    <g fill="#5eead4">
      <circle cx="-70" cy="-60" r="5"/><circle cx="70" cy="-60" r="5"/>
      <circle cx="-80" cy="-10" r="5"/><circle cx="80" cy="-10" r="5"/>
      <circle cx="-70" cy="40" r="5"/><circle cx="70" cy="40" r="5"/>
    </g>
    <path d="M-32,10 L-8,42 L44,-24" fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="470" font-size="50" fill="#5eead4">AI 读懂了合约</text>
    <text x="64" y="524" font-size="50" fill="#e6edf3">安全核验谁做主</text>
