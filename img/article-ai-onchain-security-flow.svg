<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 辅助链上安全核验的四步流程图">
  <defs>
    <linearGradient id="flowEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <pattern id="flowDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#0a0f14"/>
  <rect width="1200" height="420" fill="url(#flowDots)"/>
  <text x="60" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#5eead4">AI 辅助链上安全核验 · 四步闭环</text>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <g transform="translate(60,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdge)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">1</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">AI 初筛</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">让模型快速标出可疑</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">权限、外部调用与</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">异常资金路径</text>
    </g>
    <g transform="translate(340,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdge)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">2</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">链上复核</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">到区块浏览器逐条</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">对照真实合约代码</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">与授权记录</text>
    </g>
    <g transform="translate(620,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdge)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">3</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">压力测试</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">设想极端行情、预言</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">机延迟与权限被劫持</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">时的最坏情况</text>
    </g>
    <g transform="translate(900,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdge)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">4</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">人工定夺</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">由人对边界与残余</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">风险做最终判断，</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">不把结论交给模型</text>
    </g>
  </g>
  <g fill="url(#flowEdge)">
    <path d="M300,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
    <path d="M580,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
    <path d="M860,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
  </g>
</svg>
