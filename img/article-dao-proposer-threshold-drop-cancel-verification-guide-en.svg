<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DAO Proposal Threshold Check Cover">
  <defs>
    <radialGradient id="glowGovEn" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGovEn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridGovEn" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#818cf8" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#090d16"/>
  <rect width="1200" height="600" fill="url(#gridGovEn)"/>
  
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#6366f1"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="750" fill="#ffffff" text-anchor="middle">RE</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">Crypto Research · On-Chain Governance</text>
  </g>

  <circle cx="880" cy="280" r="240" fill="url(#glowGovEn)"/>

  <!-- Diagram: Voting Power Drop & Cancel Trigger -->
  <g transform="translate(620, 120)">
    <!-- Threshold Line -->
    <line x1="40" y1="140" x2="480" y2="140" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <text x="475" y="132" font-family="'Segoe UI',Consolas,monospace" font-size="12" font-weight="700" fill="#818cf8" text-anchor="end">threshold: 65,000 COMP</text>

    <!-- Votes Curve -->
    <path d="M 40 90 Q 150 90, 200 110 T 260 190 T 360 210 T 460 210" fill="none" stroke="#f43f5e" stroke-width="3.5" filter="url(#softGovEn)"/>

    <!-- Point A: Above Threshold -->
    <circle cx="120" cy="90" r="8" fill="#34d399"/>
    <text x="120" y="65" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">Propose (68k)</text>

    <!-- Point B: Flash Drop Event -->
    <circle cx="260" cy="190" r="9" fill="#f43f5e"/>
    <line x1="260" y1="130" x2="260" y2="175" stroke="#f43f5e" stroke-width="2"/>
    <text x="260" y="115" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">Staked into Aave / Transfer (-5k)</text>

    <!-- State Transition Card -->
    <g transform="translate(260, 240)">
      <rect x="-10" y="0" width="220" height="70" rx="12" fill="#131b2e" stroke="#f43f5e" stroke-width="1.8"/>
      <text x="100" y="26" font-family="'Segoe UI',Consolas,monospace" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">getPriorVotes &lt; threshold</text>
      <text x="100" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#f43f5e" text-anchor="middle">Permissionless cancel(id)</text>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(64, 440)">
    <text font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fafc">Proposal Threshold Check: Drops Trigger Open Cancel</text>
    <text y="46" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="500" fill="#94a3b8">Any third party can cancel a Governor proposal once proposer votes drop below threshold</text>
  </g>
</svg>