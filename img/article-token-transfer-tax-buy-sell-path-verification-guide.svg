  <rect width="1200" height="600" fill="url(#bg)"/>
  <g fill="none" stroke="#c9a227" opacity=".22">
    <path d="M48 168H1152"/><path d="M48 248H1152"/><path d="M48 328H1152"/><path d="M48 408H1152"/><path d="M48 488H1152"/>
  </g>
  <g font-family="Microsoft YaHei,Segoe UI,Arial,sans-serif">
