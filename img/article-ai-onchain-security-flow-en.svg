<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four-step loop for AI-assisted on-chain security verification">
  <defs>
    <linearGradient id="flowEdgeEn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <pattern id="flowDotsEn" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#0a0f14"/>
  <rect width="1200" height="420" fill="url(#flowDotsEn)"/>
  <text x="60" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#5eead4">AI-Assisted On-Chain Security Review · Four-Step Loop</text>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <g transform="translate(60,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdgeEn)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">1</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">AI Triage</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">Let the model flag</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">suspicious permissions</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">and fund paths</text>
    </g>
    <g transform="translate(340,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdgeEn)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">2</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">On-Chain Check</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">Cross-check each flag</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">against real contract</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">code and approvals</text>
    </g>
    <g transform="translate(620,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdgeEn)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">3</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">Stress Test</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">Model worst cases:</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">extreme prices, oracle</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">lag, hijacked keys</text>
    </g>
    <g transform="translate(900,120)">
      <rect width="240" height="220" rx="14" fill="#0d1b1a" stroke="url(#flowEdgeEn)" stroke-width="2"/>
      <text x="24" y="46" font-size="34" font-weight="800" fill="#5eead4">4</text>
      <text x="24" y="90" font-size="19" font-weight="700" fill="#e6edf3">Human Call</text>
      <text x="24" y="126" font-size="14" fill="#9aa6b8">A person judges the</text>
      <text x="24" y="148" font-size="14" fill="#9aa6b8">limits and residual risk</text>
      <text x="24" y="170" font-size="14" fill="#9aa6b8">not the model</text>
    </g>
  </g>
  <g fill="url(#flowEdgeEn)">
    <path d="M300,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
    <path d="M580,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
    <path d="M860,230 l28,0 l0,-8 l16,12 l-16,12 l0,-8 l-28,0 z"/>
  </g>
</svg>
