<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="订阅说取消了，卡这边的扣款权限停了吗 主题配图">
  <defs>
    <radialGradient id="rnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rnEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="rnSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rnDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#rnDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">续费核验 · 授权撤销 · 拒付流程</text>

  <!-- card with recurring-cycle arrow, a clock countdown, and an on/off renewal toggle -->
  <g transform="translate(640,300)" filter="url(#rnSoft)">
    <circle r="200" fill="url(#rnGlow)" opacity="0.7"/>

    <g transform="translate(0,0)">
      <!-- card icon -->
      <g transform="translate(-170,10)">
        <rect x="-58" y="-38" width="116" height="76" rx="11" fill="#111820" stroke="#5ec8e0" stroke-width="3"/>
        <rect x="-58" y="-18" width="116" height="15" fill="#5ec8e0" fill-opacity="0.35"/>
        <rect x="-40" y="14" width="38" height="9" rx="3" fill="#7f8aa3"/>
        <circle cx="38" cy="18" r="12" fill="none" stroke="#4fd8a5" stroke-width="3"/>
      </g>

      <!-- clock countdown to renewal -->
      <g transform="translate(10,-10)">
        <circle r="42" fill="#111820" stroke="#f0b64a" stroke-width="3.5"/>
        <line x1="0" y1="0" x2="0" y2="-24" stroke="#f0b64a" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="16" y2="8" stroke="#f0b64a" stroke-width="4" stroke-linecap="round"/>
        <circle r="3" fill="#f0b64a"/>
        <path d="M -42 46 A 46 46 0 0 1 -20 82" stroke="#f0b64a" stroke-width="2.5" fill="none" stroke-dasharray="3 6" opacity="0.7"/>
      </g>

      <!-- recurring cycle arrow linking clock to toggle -->
      <path d="M 52 -10 C 100 -10, 130 20, 150 40" stroke="url(#rnEdge)" stroke-width="3" fill="none" stroke-dasharray="4 8"/>
      <path d="M 142 30 L 152 42 L 138 48" stroke="#4fd8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- auto-renew toggle switch (set to off) -->
      <g transform="translate(210,60)">
        <rect x="-38" y="-18" width="76" height="36" rx="18" fill="#111820" stroke="#7f8aa3" stroke-width="3"/>
        <circle cx="-20" cy="0" r="12" fill="#7f8aa3"/>
        <text x="0" y="42" font-family="'Consolas',monospace" font-size="10" fill="#7f8aa3" text-anchor="middle">自动续费</text>
      </g>
    </g>

    <rect x="-160" y="150" width="320" height="88" rx="12" fill="#111820" stroke="url(#rnEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">商户已取消 · 卡侧授权状态</text>
      <text x="0" y="192">到期扣款 · 误扣申诉/拒付</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">卡侧确认撤销才算数</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="36" fill="#5ec8e0">卡这边的扣款权限停了吗</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">虚拟卡订阅自动续费核验：到期前怎么确认会不会被扣款</text>
</svg>
