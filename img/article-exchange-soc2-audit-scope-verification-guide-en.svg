<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exchange SOC 2 audit verification guide theme illustration">
  <defs>
    <radialGradient id="glowscen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb066" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#ffb066" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <filter id="softscen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsscen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsscen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#ffb066"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowscen)"/>
  <g filter="url(#softscen)">
    <rect x="800" y="140" width="140" height="180" rx="8" fill="#10161f" stroke="#ffb066" stroke-width="3"/>
    <line x1="822" y1="180" x2="918" y2="180" stroke="#ffb066" stroke-width="4" stroke-linecap="round"/>
    <line x1="822" y1="205" x2="918" y2="205" stroke="#ffb066" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="822" y1="230" x2="890" y2="230" stroke="#ffb066" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="920" cy="290" r="26" fill="none" stroke="#ffb066" stroke-width="4"/>
    <text x="920" y="298" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#ffb066" text-anchor="middle">?</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="30" fill="#ffb066"><tspan x="64" y="460">Exchange SOC 2 Audit</tspan><tspan x="64" y="510">Verification</tspan></text>
  </g>
</svg>
