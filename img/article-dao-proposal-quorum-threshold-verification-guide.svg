<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DAO提案法定人数核验 主题配图">
  <defs>
    <radialGradient id="glowqzh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c98a3f" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#c98a3f" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c98a3f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softqzh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsqzh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsqzh)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#c98a3f"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="230" r="230" fill="url(#glowqzh)"/>
  <g filter="url(#softqzh)">
    <circle cx="800" cy="250" r="14" fill="#c98a3f"/>
    <circle cx="850" cy="290" r="14" fill="#c98a3f"/>
    <circle cx="900" cy="230" r="14" fill="#c98a3f"/>
    <circle cx="960" cy="270" r="10" fill="#3d322a" opacity="0.6"/>
    <circle cx="1010" cy="220" r="10" fill="#3d322a" opacity="0.6"/>
    <circle cx="1030" cy="300" r="10" fill="#3d322a" opacity="0.6"/>
    <g transform="translate(900,370)">
      <rect x="-92" y="-38" width="184" height="76" rx="14" fill="#10161f" stroke="#c98a3f" stroke-width="2.5" opacity="0.9"/>
      <text x="0" y="7" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#c98a3f" text-anchor="middle">Quorum = 0</text>
    </g>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="42" fill="#c98a3f"><tspan x="64" y="470">DAO提案法定人数核验</tspan></text>
  </g>
  <text x="64" y="506" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#7f8aa3">超六成提案根本没有设置quorum门槛</text>
</svg>
