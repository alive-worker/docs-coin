<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">Same Range: Pay 1 to Inflow, Receive 0 on Outflow</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="24">SqrtPriceMath Rounding Check: 1 wei asymmetry in favor of the pool</text>
  
  <!-- Inflow box -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Pool Receiving Tokens (roundUp = true)</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">divRoundingUp(0.099...) rounds up</text>
  <text x="94" y="370" fill="#e07a7a" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">Must pay 1</text>
  <text x="350" y="370" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">(Protects pool)</text>

  <!-- Outflow box -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Pool Paying Tokens (roundUp = false)</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">mulDiv(0.099...) truncates down</text>
  <text x="666" y="370" fill="#7dcea0" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">Gives 0</text>
  <text x="880" y="370" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">(Protects pool)</text>

  <text x="64" y="520" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="24">⚠️ Theoretical delta 0.099: round-trips lose 1 wei, eliminating rounding drain attacks</text>
</svg>