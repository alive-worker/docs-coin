      <stop offset="0%" stop-color="#6fa8dc" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#6fa8dc" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6fa8dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bartokenomicszh" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3f6fa3" stop-opacity="0.95"/>
