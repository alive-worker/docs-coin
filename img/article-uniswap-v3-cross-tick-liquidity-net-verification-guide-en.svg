<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">Crossing Left Past 200: 4000 - (-1000) = 5000</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="24">Cross-Tick Liquidity Net: leftward step must negate liquidityNet</text>
  
  <!-- Right crossing -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Crossing Right Past 200 (Price Rises)</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">Add original net: 5000 + (-1000)</text>
  <text x="94" y="370" fill="#7dcea0" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">= 4000</text>
  <text x="270" y="370" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">(Exiting range)</text>

  <!-- Left crossing -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Crossing Left Past 200 (Price Drops)</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">Subtract net: 4000 - (-1000)</text>
  <text x="666" y="370" fill="#7dcea0" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">= 5000</text>
  <text x="840" y="370" fill="#e07a7a" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">(Bug yields 3000)</text>

  <text x="64" y="520" fill="#e07a7a" font-family="Segoe UI, sans-serif" font-size="24">⚠️ Omitting zeroForOne negation gives 3000 instead of 5000 (error of 2000)</text>
</svg>