<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0a0a0a"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.3"/>

  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ef4444" text-anchor="middle">DeFi智能合约审计清单</text>
  <text x="600" y="95" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">Smart Contract Security Audit Checklist</text>

  <!-- Central Shield Icon -->
  <g transform="translate(600, 300)">
    <!-- Shield shape -->
    <path d="M 0,-80 L 50,-60 L 50,20 Q 50,60 0,90 Q -50,60 -50,20 L -50,-60 Z"
          fill="url(#shieldGrad)" stroke="#ef4444" stroke-width="3"/>

    <!-- Lock symbol inside shield -->
    <circle cx="0" cy="-10" r="12" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="-15" y="-10" width="30" height="25" rx="3" fill="#fff" opacity="0.9"/>
    <rect x="-8" y="0" width="16" height="8" fill="#ef4444"/>
  </g>

  <!-- Five vulnerability nodes around shield -->
  <!-- Top: Reentrancy -->
  <g transform="translate(600, 185)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="-52" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">重入攻击</text>
    <text x="0" y="-34" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Reentrancy</text>
    <text x="0" y="6" font-family="monospace" font-size="20" fill="#ef4444" text-anchor="middle">⟲</text>
    <line x1="0" y1="35" x2="0" y2="50" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Top Right: Integer Overflow -->
  <g transform="translate(780, 220)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="-50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">整数溢出</text>
    <text x="0" y="-30" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Overflow</text>
    <text x="0" y="8" font-family="monospace" font-size="22" fill="#ef4444" text-anchor="middle">∞</text>
    <line x1="-25" y1="25" x2="-130" y2="50" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Right: Access Control -->
  <g transform="translate(780, 380)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">权限控制</text>
    <text x="0" y="88" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Access</text>
    <text x="0" y="8" font-family="monospace" font-size="24" fill="#ef4444" text-anchor="middle">🔑</text>
    <line x1="-25" y1="-25" x2="-130" y2="-50" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Bottom Right: Oracle -->
  <g transform="translate(680, 470)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">预言机</text>
    <text x="0" y="88" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Oracle</text>
    <text x="0" y="8" font-family="monospace" font-size="22" fill="#ef4444" text-anchor="middle">📊</text>
    <line x1="-25" y1="-30" x2="-55" y2="-80" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Bottom Left: Flash Loan -->
  <g transform="translate(520, 470)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">闪电贷</text>
    <text x="0" y="88" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Flash Loan</text>
    <text x="0" y="8" font-family="monospace" font-size="22" fill="#ef4444" text-anchor="middle">⚡</text>
    <line x1="25" y1="-30" x2="55" y2="-80" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Left: Tools -->
  <g transform="translate(420, 380)">
    <circle cx="0" cy="0" r="35" fill="#1a1a1a" stroke="#ef4444" stroke-width="2.5"/>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">审计工具</text>
    <text x="0" y="88" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Tools</text>
    <text x="0" y="8" font-family="monospace" font-size="22" fill="#ef4444" text-anchor="middle">🔧</text>
    <line x1="25" y1="-25" x2="130" y2="-50" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Bottom text labels -->
  <text x="120" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Slither</text>
  <text x="220" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Mythril</text>
  <text x="320" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Echidna</text>
  <text x="880" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Formal Verification</text>
  <text x="1050" y="560" font-family="Arial, sans-serif" font-size="14" fill="#666">Audit Firms</text>
</svg>