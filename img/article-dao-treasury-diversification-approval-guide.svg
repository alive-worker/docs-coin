<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DAO国库多元化提案：把单一代币换成稳定币，审批链条卡在哪一步 主题配图">
  <defs>
    <radialGradient id="glowdivzh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab4f5" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#8ab4f5" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8ab4f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softdivzh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsdivzh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsdivzh)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#8ab4f5"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowdivzh)"/>
  <g filter="url(#softdivzh)">
    <circle cx="820" cy="210" r="90" fill="none" stroke="#8ab4f5" stroke-width="3"/>
    <path d="M820 120 A90 90 0 0 1 910 210 L820 210 Z" fill="#8ab4f5" opacity="0.75"/>
    <text x="820" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#8ab4f5" text-anchor="middle" opacity="0.7">TREASURY</text>
    <path d="M940 210 L1000 210" stroke="#8ab4f5" stroke-width="3" stroke-dasharray="4 6"/>
    <path d="M984 196 l16 14 l-16 14" fill="none" stroke="#8ab4f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1020" y="165" width="90" height="90" rx="12" fill="#10161f" stroke="#8ab4f5" stroke-width="2.5"/>
    <text x="1065" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="800" fill="#8ab4f5" text-anchor="middle">$</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="46" fill="#8ab4f5"><tspan x="64" y="470">DAO国库多元化提案</tspan></text>
  </g>
  <text x="64" y="506" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#7f8aa3">审批链条卡在哪一步</text>
