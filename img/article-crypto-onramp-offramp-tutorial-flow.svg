<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="交易所出入金五步流程：注册KYC、法币入金、买币、提币到钱包、安全出金">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#081019"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123152"/><stop offset="1" stop-color="#0d2036"/></linearGradient>
    <pattern id="g2" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#356" stroke-opacity="0.18" stroke-width="1"/></pattern>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4fb0e6"/></marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg2)"/>
  <rect width="1200" height="420" fill="url(#g2)"/>
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef6ff">交易所出入金五步走：从法币到链上，再安全地换回来</text>

  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <g transform="translate(40 108)">
      <rect width="200" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="17" fill="#3fb6e0"/><text x="32" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#04121a">1</text>
      <text x="60" y="44" font-size="19" font-weight="700" fill="#eafcf8">注册 KYC</text>
      <text x="18" y="84" font-size="14.5" fill="#a9c6dd">选合规交易所，</text>
      <text x="18" y="107" font-size="14.5" fill="#a9c6dd">完成实名认证，</text>
      <text x="18" y="130" font-size="14.5" fill="#a9c6dd">开启二次验证</text>
    </g>
    <g transform="translate(272 108)">
      <rect width="200" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="17" fill="#3fb6e0"/><text x="32" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#04121a">2</text>
      <text x="60" y="44" font-size="19" font-weight="700" fill="#eafcf8">法币入金</text>
      <text x="18" y="84" font-size="14.5" fill="#a9c6dd">选好入金通道，</text>
      <text x="18" y="107" font-size="14.5" fill="#a9c6dd">小额先试，</text>
      <text x="18" y="130" font-size="14.5" fill="#a9c6dd">核对到账</text>
    </g>
    <g transform="translate(504 108)">
      <rect width="200" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="17" fill="#3fb6e0"/><text x="32" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#04121a">3</text>
      <text x="60" y="44" font-size="19" font-weight="700" fill="#eafcf8">买币</text>
      <text x="18" y="84" font-size="14.5" fill="#a9c6dd">看清 Maker/</text>
      <text x="18" y="107" font-size="14.5" fill="#a9c6dd">Taker 费率，</text>
      <text x="18" y="130" font-size="14.5" fill="#a9c6dd">按需下单</text>
    </g>
    <g transform="translate(736 108)">
      <rect width="200" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="17" fill="#3fb6e0"/><text x="32" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#04121a">4</text>
      <text x="60" y="44" font-size="19" font-weight="700" fill="#eafcf8">提币</text>
      <text x="18" y="84" font-size="14.5" fill="#a9c6dd">选对链（TRC20/</text>
      <text x="18" y="107" font-size="14.5" fill="#a9c6dd">ERC20），核对</text>
      <text x="18" y="130" font-size="14.5" fill="#a9c6dd">地址与手续费</text>
    </g>
    <g transform="translate(968 108)">
      <rect width="200" height="150" rx="14" fill="url(#box)" stroke="#4fd0c0" stroke-width="2"/>
      <circle cx="32" cy="38" r="17" fill="#4fd0c0"/><text x="32" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#04121a">5</text>
      <text x="60" y="44" font-size="19" font-weight="700" fill="#eafcf8">安全出金</text>
      <text x="18" y="84" font-size="14.5" fill="#a9c6dd">留意限额与风控，</text>
      <text x="18" y="107" font-size="14.5" fill="#a9c6dd">保留凭证，</text>
      <text x="18" y="130" font-size="14.5" fill="#7fe6d5">合规换回法币</text>
    </g>
  </g>
  <g stroke="#4fb0e6" stroke-width="2.5" fill="none">
    <line x1="240" y1="183" x2="268" y2="183" marker-end="url(#ar)"/>
    <line x1="472" y1="183" x2="500" y2="183" marker-end="url(#ar)"/>
    <line x1="704" y1="183" x2="732" y2="183" marker-end="url(#ar)"/>
    <line x1="936" y1="183" x2="964" y2="183" marker-end="url(#ar)"/>
  </g>
  <text x="600" y="330" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6f9ec0">每一步都先小额验证：入金看到账、提币先测试转账，别拿大额去试错</text>
  <text x="600" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#41708a">KYC → DEPOSIT → BUY → WITHDRAW → CASH OUT</text>
</svg>
