<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">同一区间：收进付 1，吐出给 0</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26">SqrtPriceMath 进位核验：永远偏向池子的 1 wei 剪刀差</text>
  
  <!-- Inflow box -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">池子收进代币（roundUp = true）</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">divRoundingUp(0.099...) 向上进一</text>
  <text x="94" y="370" fill="#e07a7a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">要付 1 wei</text>
  <text x="350" y="370" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">（多收 1 保护池子）</text>

  <!-- Outflow box -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">池子吐出代币（roundUp = false）</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">mulDiv(0.099...) 向下截断</text>
  <text x="666" y="370" fill="#7dcea0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">只给 0 wei</text>
  <text x="910" y="370" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">（少吐 1 保护池子）</text>

  <text x="64" y="520" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">⚠️ 理论代币量 0.099：来回往返天然产生 1 wei 剪刀差，彻底封堵抽水套利</text>
</svg>