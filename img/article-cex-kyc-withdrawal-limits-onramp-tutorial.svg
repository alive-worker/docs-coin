      <text x="40" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#9aa7bd" text-anchor="middle">FEE</text>
      <text x="40" y="36" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#6ec7ff" text-anchor="middle">0.1%</text>
    </g>
    <g transform="translate(120,50)">
      <rect x="0" y="0" width="80" height="46" rx="8" fill="#111a2a" stroke="#3a4a5f" stroke-width="2"/>
      <text x="40" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#9aa7bd" text-anchor="middle">NETWORK</text>
      <text x="40" y="36" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#c8a7ff" text-anchor="middle">TRC20</text>
