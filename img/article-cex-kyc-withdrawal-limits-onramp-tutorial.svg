  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#6ec7ff">交易所出入金教程 · KYC · WITHDRAWAL</text>

  <g transform="translate(760,300)" filter="url(#softGlow)">
