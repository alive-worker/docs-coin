    <rect x="-70" y="-90" width="140" height="180" rx="10" fill="#111a2a" stroke="#6ec7ff" stroke-width="2.5"/>
    <circle cx="0" cy="-50" r="18" fill="none" stroke="#6ec7ff" stroke-width="2.5"/>
    <path d="M-28 -8 a28 22 0 0 1 56 0" fill="none" stroke="#6ec7ff" stroke-width="2.5"/>
    <rect x="-46" y="20" width="92" height="10" rx="3" fill="#243247"/>
    <rect x="-46" y="20" width="70" height="10" rx="3" fill="#6ec7ff"/>
    <text x="0" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#9aa7bd" text-anchor="middle">KYC LV.3</text>
