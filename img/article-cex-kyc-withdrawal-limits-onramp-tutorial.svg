    <line x1="-110" y1="73" x2="-70" y2="30" stroke="#f0b64a" stroke-width="1.5" stroke-dasharray="2 6"/>
    <line x1="120" y1="-67" x2="70" y2="-40" stroke="#6ec7ff" stroke-width="1.5" stroke-dasharray="2 6"/>
    <line x1="120" y1="73" x2="70" y2="30" stroke="#c8a7ff" stroke-width="1.5" stroke-dasharray="2 6"/>
