<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="代币解锁与抛压研究：用链上数据提前看出砸盘风险 主题配图">
  <defs>
    <radialGradient id="glowtokenunloczh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b03f" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#e0b03f" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e0b03f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bartokenunloczh" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c98f2a" stop-opacity="0.95"/>
