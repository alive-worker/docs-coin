    <rect x="780" y="71" width="18" height="139" rx="2" fill="url(#bartokenunloczh)"/>
    <line x1="849" y1="130" x2="849" y2="272" stroke="#5a6478" stroke-width="2"/>
    <rect x="840" y="138" width="18" height="126" rx="2" fill="#3a4452"/>
