<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0a1628"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#38bdf8" text-anchor="middle">Token Unlocks &amp; Sell Pressure</text>
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="17" fill="#7dd3fc" text-anchor="middle">Spotting Dump Risk With On-Chain Data</text>

  <!-- Chart frame -->
  <line x1="150" y1="440" x2="1050" y2="440" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="440" stroke="#334155" stroke-width="2"/>
  <text x="120" y="170" font-family="monospace" font-size="12" fill="#64748b" text-anchor="end">Supply</text>
  <text x="1050" y="465" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">Timeline →</text>

  <!-- Cliff + linear vesting curve -->
  <path d="M 150,420 L 330,420 L 330,300 L 510,270 L 690,240 L 870,215 L 1050,200" fill="none" stroke="url(#curveGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- cliff marker -->
  <line x1="330" y1="160" x2="330" y2="440" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,5"/>
  <circle cx="330" cy="300" r="7" fill="#ef4444"/>
  <text x="330" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">Cliff Unlock</text>

  <!-- Unlock supply bars -->
  <rect x="315" y="330" width="30" height="110" fill="url(#barGrad)" opacity="0.85"/>
  <rect x="495" y="360" width="30" height="80" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="675" y="378" width="30" height="62" fill="url(#barGrad)" opacity="0.6"/>
  <rect x="855" y="392" width="30" height="48" fill="url(#barGrad)" opacity="0.5"/>

  <!-- Three supply classes legend nodes -->
  <g transform="translate(200, 505)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">T</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Team</text>
  </g>
  <g transform="translate(340, 505)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">I</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Investor</text>
  </g>
  <g transform="translate(520, 505)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">E</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Ecosystem</text>
  </g>

  <!-- Flow arrow to exchange -->
  <g transform="translate(890, 505)">
    <rect x="-10" y="-14" width="170" height="28" rx="6" fill="#0a1628" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="5" font-family="Arial, sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">→ Exchange / USDT</text>
  </g>

  <!-- data ticks -->
  <text x="330" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">M12</text>
  <text x="510" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">M15</text>
  <text x="690" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">M18</text>
  <text x="870" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">M21</text>
</svg>
