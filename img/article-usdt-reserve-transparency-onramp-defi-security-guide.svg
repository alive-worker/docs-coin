<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="USDT稳定币基础、出入金与链上安全封面图">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#4f8cff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- brand -->
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#4f8cff"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密研究笔记</text>
  </g>

  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#4f8cff">USDT 基础 · 储备透明度 · 出入金 · 链上安全</text>

  <!-- central USDT node with orbiting pillars -->
  <g transform="translate(830,300)" filter="url(#softGlow)">
    <circle r="150" fill="url(#nodeGlow)"/>
    <!-- core coin -->
    <circle r="60" fill="#111820" stroke="#4f8cff" stroke-width="3"/>
    <text x="0" y="4" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#4f8cff" text-anchor="middle">₮</text>
    <text x="0" y="30" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#7f8aa3" text-anchor="middle">USDT</text>
    <!-- pillar: reserves -->
    <circle cx="0" cy="-120" r="30" fill="#0a0a0f" stroke="#5fe3b3" stroke-width="2.2"/>
    <text x="0" y="-124" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#5fe3b3" text-anchor="middle">$</text>
    <text x="0" y="-108" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#5fe3b3" text-anchor="middle">储备</text>
    <!-- pillar: ramp -->
    <circle cx="118" cy="60" r="30" fill="#0a0a0f" stroke="#f0c040" stroke-width="2.2"/>
    <text x="118" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#f0c040" text-anchor="middle">&#x21C5;</text>
    <text x="118" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#f0c040" text-anchor="middle">出入金</text>
    <!-- pillar: security -->
    <circle cx="-118" cy="60" r="30" fill="#0a0a0f" stroke="#4f8cff" stroke-width="2.2"/>
    <text x="-118" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#4f8cff" text-anchor="middle">&#x2713;</text>
    <text x="-118" y="74" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#4f8cff" text-anchor="middle">链上安全</text>
    <!-- connectors -->
    <line x1="0" y1="-60" x2="0" y2="-90" stroke="#5fe3b3" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
    <line x1="52" y1="30" x2="96" y2="46" stroke="#f0c040" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
    <line x1="-52" y1="30" x2="-96" y2="46" stroke="#4f8cff" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
  </g>

  <!-- headline -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="470" font-size="40" fill="#4f8cff">USDT到底靠不靠谱？</text>
  </g>
  <text x="64" y="512" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#e6ecf7" font-weight="600">稳定币基础 · 出入金教程 · DeFi链上安全全解</text>
  <text x="64" y="544" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#7f8aa3">从看懂储备，到把钱安全地放进链上</text>
</svg>
