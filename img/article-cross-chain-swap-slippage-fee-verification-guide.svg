<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换实操核验：报价滑点和到账金额，真的对得上吗 主题配图">
  <defs>
    <radialGradient id="csGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="csSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="csDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#csDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">跨链兑换 · 滑点核验 · 到账对账</text>

  <!-- two token icons bridged by a routing arrow, with a slippage gauge -->
  <g transform="translate(640,300)" filter="url(#csSoft)">
    <circle r="200" fill="url(#csGlow)" opacity="0.7"/>

    <!-- source token -->
    <g transform="translate(-210,-10)">
      <circle r="46" fill="#111820" stroke="#5ec8e0" stroke-width="3"/>
      <text x="0" y="8" font-family="'Consolas',monospace" font-size="18" font-weight="800" fill="#5ec8e0" text-anchor="middle">A</text>
    </g>
    <!-- destination token -->
    <g transform="translate(210,-10)">
      <circle r="46" fill="#111820" stroke="#4fd8a5" stroke-width="3"/>
      <text x="0" y="8" font-family="'Consolas',monospace" font-size="18" font-weight="800" fill="#4fd8a5" text-anchor="middle">B</text>
    </g>

    <!-- bridge/chain-link motif -->
    <g stroke="url(#csEdge)" stroke-width="4" fill="none" opacity="0.85">
      <path d="M -164 -10 C -80 -70, 80 -70, 164 -10" stroke-dasharray="6 10"/>
    </g>
    <path d="M 60 -46 L 96 -46 L 88 -54 M 96 -46 L 88 -38" stroke="#4fd8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- slippage percentage gauge -->
    <g transform="translate(0,70)">
      <path d="M -110 40 A 120 120 0 0 1 110 40" fill="none" stroke="#243244" stroke-width="10" stroke-linecap="round"/>
      <path d="M -110 40 A 120 120 0 0 1 -10 -74" fill="none" stroke="url(#csEdge)" stroke-width="10" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-45" y2="-70" stroke="#f0b64a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="10" fill="#0c1620" stroke="#f0b64a" stroke-width="3"/>
      <text x="0" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#c9d3e0" text-anchor="middle">滑点核验</text>
    </g>

    <rect x="-96" y="150" width="192" height="88" rx="12" fill="#111820" stroke="url(#csEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">报价滑点 0.5%</text>
      <text x="0" y="192">Gas + 桥接费 + 服务费</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">? 到账对账中</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="40" fill="#5ec8e0">报价滑点和到账金额，真的对得上吗</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">跨链兑换实操核验方法：滑点 · 手续费 · 到账时间</text>
</svg>
