<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="USDT 稳定币基础与锚定机制 主题配图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="0.55" stop-color="#0d1f3c"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1f9d8f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f9d8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31c9b3"/>
      <stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2f6f8c" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#3fd0c0" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- node graph, regular pattern -->
  <g stroke="#3fd0c0" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="150" y1="120" x2="300" y2="200"/>
    <line x1="300" y1="200" x2="180" y2="330"/>
    <line x1="300" y1="200" x2="470" y2="150"/>
    <line x1="900" y1="130" x2="1040" y2="230"/>
    <line x1="1040" y1="230" x2="960" y2="380"/>
    <line x1="1040" y1="230" x2="1120" y2="120"/>
    <line x1="960" y1="380" x2="1080" y2="450"/>
  </g>
  <g fill="#31c9b3">
    <circle cx="150" cy="120" r="5"/><circle cx="300" cy="200" r="6"/>
    <circle cx="180" cy="330" r="5"/><circle cx="470" cy="150" r="5"/>
    <circle cx="900" cy="130" r="5"/><circle cx="1040" cy="230" r="6"/>
    <circle cx="960" cy="380" r="5"/><circle cx="1120" cy="120" r="5"/>
    <circle cx="1080" cy="450" r="5"/>
  </g>

  <!-- central coin / anchor -->
  <g transform="translate(600 268)">
    <circle r="118" fill="url(#coin)" opacity="0.16"/>
    <circle r="92" fill="none" stroke="url(#coin)" stroke-width="3"/>
    <circle r="92" fill="#0b1a2e" fill-opacity="0.7"/>
    <text x="0" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#eafcf8">$1.00</text>
    <text x="0" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#7fe6d5">USDT · PEG</text>
  </g>

  <!-- title text -->
  <text x="600" y="452" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="700" fill="#f2f7ff">USDT 稳定币基础</text>
  <text x="600" y="500" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#8fb6d6">锚定机制 · 储备透明 · 脱锚风险</text>
  <text x="600" y="540" text-anchor="middle" font-family="Consolas, monospace" font-size="16" letter-spacing="4" fill="#4f8fb0">STABLECOIN FUNDAMENTALS</text>
</svg>
