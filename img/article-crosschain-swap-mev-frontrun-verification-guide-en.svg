<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Bots Always Beat You to Cross-Chain Swap Arbitrage cover image">
  <defs>
    <radialGradient id="mfeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mfeEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="mfeSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="mfeDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#mfeDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes · Cross-Chain Risk Verification</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">LATENCY WINDOW · FRONT-RUN · SLIPPAGE CHECK</text>

  <g transform="translate(600,300)" filter="url(#mfeSoft)">
    <circle r="210" fill="url(#mfeGlow)" opacity="0.7"/>

    <g transform="translate(0,-30)">
      <text x="-260" y="-6" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3">SOURCE CHAIN</text>
      <line x1="-260" y1="0" x2="260" y2="0" stroke="#3a4258" stroke-width="3"/>
      <circle cx="-180" cy="0" r="6" fill="#4fd8a5"/>
      <text x="-180" y="-14" font-family="'Consolas',monospace" font-size="10" fill="#4fd8a5" text-anchor="middle">submit</text>
      <circle cx="-40" cy="0" r="6" fill="#4fd8a5"/>
      <text x="-40" y="-14" font-family="'Consolas',monospace" font-size="10" fill="#4fd8a5" text-anchor="middle">confirm</text>
    </g>

    <g transform="translate(0,60)">
      <text x="-260" y="-6" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3">DESTINATION CHAIN</text>
      <line x1="-260" y1="0" x2="260" y2="0" stroke="#3a4258" stroke-width="3"/>
      <g transform="translate(90,0)">
        <path d="M -18 -20 L 18 -20 L 24 0 L 18 20 L -18 20 L -24 0 Z" fill="none" stroke="#f0663f" stroke-width="2.5"/>
        <circle r="5" fill="#f0663f"/>
        <text x="0" y="-30" font-family="'Consolas',monospace" font-size="10" font-weight="700" fill="#f0663f" text-anchor="middle">bot cuts ahead</text>
      </g>
      <circle cx="180" cy="0" r="6" fill="#f0b64a"/>
      <text x="180" y="24" font-family="'Consolas',monospace" font-size="10" fill="#f0b64a" text-anchor="middle">user trade executes</text>
    </g>

    <path d="M -40 -18 L -40 6 M 180 -18 L 180 -6" stroke="#5ec8e0" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <text x="70" y="10" font-family="'Consolas',monospace" font-size="11" fill="#5ec8e0" text-anchor="middle">relayer latency window = observable and exploitable</text>

    <rect x="-170" y="130" width="340" height="70" rx="12" fill="#111820" stroke="url(#mfeEdge)" stroke-width="2"/>
    <text x="0" y="158" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">relayer observability · price impact · slippage harvest</text>
    <text x="0" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">longer window, more time for bots to compute</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="30" fill="#5ec8e0">Where Did Your Slippage Go?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Cross-chain latency, bot front-running, and after-the-fact checks</text>
</svg>
