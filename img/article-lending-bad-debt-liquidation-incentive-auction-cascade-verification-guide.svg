<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="借贷坏账清算核验：清算奖励倒挂与DEX流动性悬崖 主题配图">
  <defs>
    <radialGradient id="glowLiqZh" cx="68%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridLiqZh" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#fbbf24" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0b0c10"/>
  <rect width="1200" height="600" fill="url(#gridLiqZh)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#d97706"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">研</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">加密货币研究 · 市场结构与流动性</text>
  </g>

  <circle cx="885" cy="285" r="245" fill="url(#glowLiqZh)"/>

  <!-- Diagram: Liquidation Bonus Inversion & DEX Liquidity Cliff -->
  <g transform="translate(610, 106)">
    <!-- Safety Buffer Box -->
    <rect x="25" y="18" width="238" height="114" rx="14" fill="#18140d" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="45" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fcd34d">真实安全垫 1 - LT×(1+LB)</text>
    <text x="45" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">LT=90%, LB=7.5% → 仅 3.25%</text>
    <text x="45" y="106" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#fbbf24">并非表观 10% 缓冲</text>

    <!-- Bad Debt Inversion Box -->
    <rect x="282" y="18" width="238" height="114" rx="14" fill="#1b0f13" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="302" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fda4af">清算奖励倒挂 (穿仓)</text>
    <text x="302" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">Slippage + MEV &gt; LB</text>
    <text x="302" y="106" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#fb7185">清算人停手 → 坏账沉淀</text>

    <!-- Cascade Flow -->
    <g transform="translate(28, 162)">
      <rect x="0" y="0" width="136" height="44" rx="8" fill="#20190e" stroke="#d97706" stroke-width="1.2"/>
      <text x="68" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fcd34d" text-anchor="middle">HF &lt; 0.95 满额清算</text>

      <path d="M 136 22 L 172 22" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="178,22 170,18 170,26" fill="#fbbf24"/>

      <rect x="182" y="0" width="134" height="44" rx="8" fill="#231812" stroke="#f97316" stroke-width="1.2"/>
      <text x="249" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fdba74" text-anchor="middle">击穿 DEX 深度悬崖</text>

      <path d="M 316 22 L 352 22" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="358,22 350,18 350,26" fill="#f43f5e"/>

      <rect x="362" y="0" width="124" height="44" rx="8" fill="#241016" stroke="#e11d48" stroke-width="1.5"/>
      <text x="424" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="750" fill="#fda4af" text-anchor="middle">级联穿仓与虚高APY</text>
    </g>

    <!-- Formula Pill -->
    <rect x="28" y="238" width="490" height="36" rx="8" fill="#171410" stroke="#f59e0b" stroke-width="1"/>
    <text x="46" y="261" font-family="Consolas,'Segoe UI',monospace" font-size="12" font-weight="600" fill="#fcd34d">核验准则：PriceImpact(Q_liq) &lt; LB - 0.5% 且 零抵押坏账 &lt; 储备缓冲</text>
  </g>

  <!-- Left Side Title Block -->
  <g transform="translate(64, 206)">
    <rect x="0" y="0" width="84" height="26" rx="6" fill="#241b0c" stroke="#f59e0b" stroke-width="1"/>
    <text x="42" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="750" fill="#fbbf24" text-anchor="middle">清算核验</text>

    <text x="0" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="33" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan x="0" dy="0">借贷坏账清算核验</tspan>
      <tspan x="0" dy="50" font-size="27" fill="#94a3b8">清算奖励倒挂、DEX 流动性悬崖与级联穿仓</tspan>
    </text>

    <text x="0" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#9ca3af">
      <tspan x="0" dy="0">健康因子跌破 1 并非坏账起点：当滑点超过清算奖励或跌穿 1 - LT×(1+LB)</tspan>
      <tspan x="0" dy="24">安全垫时，清算人自动离场，未实现坏账将伪装成高利用率吞噬存款本金。</tspan>
    </text>
  </g>
</svg>