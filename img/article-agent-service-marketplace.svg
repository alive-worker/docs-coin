<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI代理服务市场定价与质量核验 主题配图">
  <defs>
    <radialGradient id="amGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#8a7fd9"/>
    </linearGradient>
    <linearGradient id="amFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7fd9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ec8e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="amSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="amDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#amDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · AI×链上 系列（五）</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">AI服务市场 · 定价与质量核验</text>

  <!-- central marketplace hub with orbiting service agents -->
  <g transform="translate(640,300)" filter="url(#amSoft)">
    <circle r="190" fill="url(#amGlow)" opacity="0.7"/>
    <g stroke="url(#amEdge)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-70"/>
      <line x1="0" y1="0" x2="176" y2="-70"/>
      <line x1="0" y1="0" x2="-176" y2="70"/>
      <line x1="0" y1="0" x2="176" y2="70"/>
      <line x1="0" y1="0" x2="0" y2="-150"/>
    </g>
    <circle cx="0" cy="0" r="56" fill="#0c1620" stroke="#5ec8e0" stroke-width="3"/>
    <text x="0" y="-4" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#5ec8e0" text-anchor="middle">市场</text>
    <text x="0" y="16" font-family="'Consolas',monospace" font-size="10" fill="#7f8aa3" text-anchor="middle">registry</text>
    <g fill="#111820" stroke="url(#amEdge)" stroke-width="2">
      <circle cx="-176" cy="-70" r="30"/>
      <circle cx="176" cy="-70" r="30"/>
      <circle cx="-176" cy="70" r="30"/>
      <circle cx="176" cy="70" r="30"/>
      <circle cx="0" cy="-150" r="26"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-66">报价A</text>
      <text x="176" y="-66">报价B</text>
      <text x="-176" y="74">评分</text>
      <text x="176" y="74">SLA</text>
      <text x="0" y="-146">用户</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#5ec8e0">谁的报价，值得信任</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">AI代理服务市场的定价机制与质量核验方法</text>
</svg>
