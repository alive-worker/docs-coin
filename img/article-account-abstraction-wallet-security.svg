<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="账户抽象钱包安全核验 主题配图">
  <defs>
    <radialGradient id="aawGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c169" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f2c169" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f2c169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aawEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c169"/>
      <stop offset="100%" stop-color="#c98a3f"/>
    </linearGradient>
    <filter id="aawSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="aawDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#aawDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f2c169"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#f2c169">账户抽象钱包 · 会话密钥安全核验</text>

  <!-- central smart account with scoped session-key branches -->
  <g transform="translate(640,300)" filter="url(#aawSoft)">
    <circle r="190" fill="url(#aawGlow)" opacity="0.7"/>
    <g stroke="url(#aawEdge)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-40"/>
      <line x1="0" y1="0" x2="176" y2="-40"/>
      <line x1="0" y1="0" x2="-140" y2="130"/>
      <line x1="0" y1="0" x2="140" y2="130"/>
    </g>
    <path d="M0,-70 L52,-42 L52,26 C52,72 26,100 0,116 C-26,100 -52,72 -52,26 L-52,-42 Z" fill="#0c1620" stroke="#f2c169" stroke-width="3"/>
    <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#f2c169" text-anchor="middle">账户</text>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">4337</text>
    <g fill="#111820" stroke="url(#aawEdge)" stroke-width="2">
      <circle cx="-176" cy="-40" r="28"/>
      <circle cx="176" cy="-40" r="28"/>
      <circle cx="-140" cy="130" r="28"/>
      <circle cx="140" cy="130" r="28"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-36">额度</text>
      <text x="176" y="-36">有效期</text>
      <text x="-140" y="134">白名单</text>
      <text x="140" y="134">社交恢复</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#f2c169">被清空的可能是你的钱</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">会话密钥授权范围、Bundler与Paymaster信任假设核验方法</text>
</svg>
