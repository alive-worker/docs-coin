<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700">Step Check: Hitting Target Rounds from Curve Input</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="24">computeSwapStep Fee Branches: Hitting needs 1002, 1001 falls short</text>
  
  <!-- Hit box -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Target Reached (Hits tickNext)</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">Curve takes 998, fee rounds up to 4</text>
  <text x="94" y="370" fill="#7dcea0" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">Total 1002</text>
  <text x="350" y="370" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">(Excess moves on)</text>

  <!-- Miss box -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Target Missed (Passing 1001)</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">1001 * 997000 / 1e6 truncates</text>
  <text x="666" y="370" fill="#e07a7a" font-family="Segoe UI, sans-serif" font-size="52" font-weight="700">Takes 997</text>
  <text x="890" y="370" fill="#8aa0bd" font-family="Segoe UI, sans-serif" font-size="20">(Fee 4, exhausted)</text>

  <text x="64" y="520" fill="#f7d488" font-family="Segoe UI, sans-serif" font-size="24">⚠️ Missing target by 1 wei fails to cross tick and skips liquidity update</text>
</svg>