<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨交易所搬砖套利核验：报价和实际成交之间，滑点吃掉了多少利润 主题配图">
  <defs>
    <radialGradient id="glowarbzh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0dc6a" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#f0dc6a" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f0dc6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softarbzh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsarbzh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsarbzh)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f0dc6a"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowarbzh)"/>
  <g filter="url(#softarbzh)">
    <g transform="translate(760,180)">
      <rect x="-56" y="-40" width="112" height="80" rx="12" fill="#10161f" stroke="#f0dc6a" stroke-width="2.5"/>
      <text x="0" y="8" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#f0dc6a" text-anchor="middle">A→B</text>
    </g>
    <path d="M830 220 L920 220" fill="none" stroke="#f0dc6a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
    <path d="M900 205 L920 220 L900 235" fill="none" stroke="#f0dc6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M970 150 L1000 190 L960 220 L1000 260" fill="none" stroke="#f0dc6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="46" fill="#f0dc6a"><tspan x="64" y="470">跨交易所搬砖套利核验</tspan></text>
  </g>
  <text x="64" y="506" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#7f8aa3">报价和实际成交之间，滑点吃掉了多少利润</text>
</svg>
