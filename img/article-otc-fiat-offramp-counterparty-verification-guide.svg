<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OTC场外换汇：对手方资质和资金隔离核验 主题配图">
  <defs>
    <radialGradient id="ofGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b64a" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f0b64a" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f0b64a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ofEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b64a"/>
      <stop offset="100%" stop-color="#f0d488"/>
    </linearGradient>
    <filter id="ofSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ofDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#ofDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f0b64a"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出海资金安全</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#f0b64a">对手方核验 · 资金隔离 · 点差比对</text>

  <!-- two nodes (you / counterparty) linked by a crypto leg and a fiat leg, with a checkpoint gate between them representing verification -->
  <g transform="translate(640,300)" filter="url(#ofSoft)">
    <circle r="200" fill="url(#ofGlow)" opacity="0.7"/>

    <g transform="translate(0,-10)">
      <!-- left node: you (crypto out) -->
      <g transform="translate(-190,10)">
        <circle r="34" fill="#111820" stroke="#f0b64a" stroke-width="3"/>
        <text x="0" y="6" font-family="'Consolas',monospace" font-size="12" font-weight="700" fill="#f0b64a" text-anchor="middle">你</text>
      </g>

      <!-- right node: counterparty (fiat in) -->
      <g transform="translate(190,10)">
        <circle r="34" fill="#111820" stroke="#f0d488" stroke-width="3"/>
        <text x="0" y="6" font-family="'Consolas',monospace" font-size="12" font-weight="700" fill="#f0d488" text-anchor="middle">对手方</text>
      </g>

      <!-- checkpoint gate in the middle -->
      <g transform="translate(0,10)">
        <rect x="-46" y="-46" width="92" height="92" rx="16" fill="#111820" stroke="url(#ofEdge)" stroke-width="2.5"/>
        <path d="M -18 -2 L -6 12 L 20 -16" fill="none" stroke="#f0b64a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="40" font-family="'Consolas',monospace" font-size="10.5" fill="#7f8aa3" text-anchor="middle">身份 · 收款账户核验</text>
      </g>

      <!-- crypto leg -->
      <path d="M -156 6 C -110 -14, -76 -14, -50 -2" fill="none" stroke="#f0b64a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="-103" y="-24" font-family="'Consolas',monospace" font-size="10.5" fill="#f0b64a" text-anchor="middle">加密资产 →</text>

      <!-- fiat leg -->
      <path d="M 50 22 C 76 34, 110 34, 156 14" fill="none" stroke="#f0d488" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
      <text x="103" y="56" font-family="'Consolas',monospace" font-size="10.5" fill="#f0d488" text-anchor="middle">← 法币到账</text>
    </g>

    <rect x="-160" y="150" width="320" height="88" rx="12" fill="#111820" stroke="url(#ofEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">经营记录 · 账户一致性 · 点差合理性</text>
      <text x="0" y="192">小额试单 · 反洗钱风控 · 资金来源申报</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#f0b64a" text-anchor="middle">先核验对手方，再决定汇多少、怎么汇</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#f0b64a">对手方资质和资金隔离核验</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">OTC场外换汇：经营记录、收款账户、报价点差与反洗钱风控</text>
</svg>
