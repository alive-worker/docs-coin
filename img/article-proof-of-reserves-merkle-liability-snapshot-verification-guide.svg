<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="储备证明PoR核验 主题配图">
  <defs>
    <radialGradient id="glowPorZh" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softPorZh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridPorZh" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#070d14"/>
  <rect width="1200" height="600" fill="url(#gridPorZh)"/>
  
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0284c7"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">研</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">加密货币研究 · 研究方法基础</text>
  </g>

  <circle cx="880" cy="280" r="240" fill="url(#glowPorZh)"/>

  <!-- Diagram: Merkle Sum Tree vs Negative Balance & Snapshot Loan -->
  <g transform="translate(610, 105)">
    <!-- Root Node -->
    <rect x="180" y="10" width="180" height="60" rx="12" fill="#0c1e2e" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="270" y="35" font-family="'Segoe UI',Consolas,monospace" font-size="13" font-weight="750" fill="#7dd3fc" text-anchor="middle">Merkle Sum Root</text>
    <text x="270" y="55" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Liabilities: 65,000 BTC</text>

    <!-- Connectors -->
    <line x1="270" y1="70" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="270" y1="70" x2="380" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Left Branch: Normal Users -->
    <rect x="80" y="120" width="160" height="52" rx="10" fill="#0c1b26" stroke="#0284c7" stroke-width="1.2"/>
    <text x="160" y="142" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">真实用户负债</text>
    <text x="160" y="160" font-family="'Segoe UI',Consolas,monospace" font-size="12" fill="#38bdf8" text-anchor="middle">+115,000 BTC</text>

    <!-- Right Branch: Negative Balance Smuggling -->
    <rect x="300" y="120" width="160" height="52" rx="10" fill="#260f15" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="380" y="142" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="750" fill="#fda4af" text-anchor="middle">注入虚假负余额</text>
    <text x="380" y="160" font-family="'Segoe UI',Consolas,monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">-50,000 BTC 抵消</text>

    <!-- Warning / Timeline Box -->
    <g transform="translate(40, 205)">
      <rect x="0" y="0" width="460" height="75" rx="12" fill="#0b1722" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="26" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">时点快照过桥借贷陷阱 (Window Dressing)</text>
      <text x="20" y="48" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#94a3b8">Block N-2: 从DeFi/OTC借入 2万 BTC 充当准备金</text>
      <text x="20" y="66" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#f43f5e">Block N (PoR快照) ➔ Block N+2: 立即还款流出</text>
    </g>
  </g>

  <!-- Left Side Title Block -->
  <g transform="translate(64, 210)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#0c1e2e" stroke="#0284c7" stroke-width="1"/>
    <text x="40" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="750" fill="#38bdf8" text-anchor="middle">储备核验</text>

    <text x="0" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan x="0" dy="0">储备证明PoR核验</tspan>
      <tspan x="0" dy="50" font-size="28" fill="#94a3b8">Merkle负债抵消陷阱与时点快照过桥借贷穿透</tspan>
    </text>

    <text x="0" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#64748b" line-height="1.6">
      <tspan x="0" dy="0">若缺少零知识非负范围证明，注入负余额即可蓄意抹平巨额用户负债；</tspan>
      <tspan x="0" dy="24">单区块快照极易被过桥借贷操纵。本文详解数学验证模型与链上审计防线。</tspan>
    </text>
  </g>
</svg>