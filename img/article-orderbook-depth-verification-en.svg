<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Order Book Depth Verification cover image">
  <defs>
    <radialGradient id="obGlowEn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b03f" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#e0b03f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e0b03f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obBarSolidEn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c98f2a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0b03f" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="obSoftEn" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="obDotsEn" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#obDotsEn)"/>
  <circle cx="880" cy="200" r="240" fill="url(#obGlowEn)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#e0b03f"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>

  <g transform="translate(140,130)">
    <line x1="0" y1="220" x2="900" y2="220" stroke="#3a4452" stroke-width="1.5"/>
    <rect x="20"  y="60"  width="52" height="160" rx="4" fill="url(#obBarSolidEn)"/>
    <rect x="90"  y="100" width="52" height="120" rx="4" fill="url(#obBarSolidEn)"/>
    <rect x="160" y="20"  width="52" height="200" rx="4" fill="url(#obBarSolidEn)" opacity="0.28" stroke="#e0b03f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="230" y="140" width="52" height="80"  rx="4" fill="url(#obBarSolidEn)"/>
    <rect x="300" y="60"  width="52" height="160" rx="4" fill="url(#obBarSolidEn)" opacity="0.28" stroke="#e0b03f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="370" y="170" width="52" height="50"  rx="4" fill="url(#obBarSolidEn)"/>
    <text x="186" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7f8aa3" text-anchor="middle">ghost</text>
    <text x="326" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7f8aa3" text-anchor="middle">ghost</text>
    <g filter="url(#obSoftEn)">
      <circle cx="186" cy="20" r="4" fill="#e0b03f"/>
      <circle cx="326" cy="60" r="4" fill="#e0b03f"/>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="480" font-size="46" fill="#e0b03f">Order Book Depth</text>
  </g>
  <text x="64" y="516" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Why displayed liquidity vanishes before you can hit it</text>
</svg>
