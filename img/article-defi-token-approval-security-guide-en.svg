    <circle cx="0" cy="0" r="60" fill="#111820" stroke="#5fe3b3" stroke-width="2.5"/>
    <path transform="translate(0,-4)" d="M-20 -4 h40 v22 a20 20 0 0 1 -40 0 z" fill="none" stroke="#5fe3b3" stroke-width="3"/>
