    <text x="-150" y="-63" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#9aa7bd" text-anchor="middle">$</text>
    <circle cx="150" cy="-70" r="34" fill="#111820" stroke="#3a4a5f" stroke-width="2"/>
