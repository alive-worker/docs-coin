    <line x1="-116" y1="-54" x2="-46" y2="-18" stroke="#3a4a5f" stroke-width="2" stroke-dasharray="2 7"/>
    <line x1="116" y1="-54" x2="46" y2="-18" stroke="#3a4a5f" stroke-width="2" stroke-dasharray="2 7"/>
    <line x1="-116" y1="74" x2="-46" y2="26" stroke="#e0655f" stroke-width="2" stroke-dasharray="2 7"/>
    <line x1="116" y1="74" x2="46" y2="26" stroke="#5fe3b3" stroke-width="2" stroke-dasharray="2 7"/>
