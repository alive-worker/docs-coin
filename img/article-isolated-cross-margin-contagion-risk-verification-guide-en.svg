<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isolated vs. cross margin verification guide theme illustration">
  <defs>
    <radialGradient id="glowmgen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6de8ac" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#6de8ac" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6de8ac" stop-opacity="0"/>
    </radialGradient>
    <filter id="softmgen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsmgen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsmgen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#6de8ac"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowmgen)"/>
  <g filter="url(#softmgen)">
    <rect x="700" y="150" width="80" height="60" rx="8" fill="none" stroke="#6de8ac" stroke-width="3" opacity="0.5"/>
    <rect x="700" y="230" width="80" height="60" rx="8" fill="#10161f" stroke="#6de8ac" stroke-width="3"/>
    <line x1="740" y1="245" x2="740" y2="275" stroke="#6de8ac" stroke-width="4" stroke-linecap="round"/>
    <line x1="725" y1="260" x2="755" y2="260" stroke="#6de8ac" stroke-width="4" stroke-linecap="round"/>
    <path d="M790 260 L850 260" stroke="#6de8ac" stroke-width="4" stroke-dasharray="2 8" opacity="0.5"/>
    <text x="820" y="248" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#6de8ac" text-anchor="middle">×?</text>
    <rect x="870" y="230" width="80" height="60" rx="8" fill="none" stroke="#6de8ac" stroke-width="3" opacity="0.5"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="32" fill="#6de8ac"><tspan x="64" y="460">Isolated vs. Cross Margin</tspan><tspan x="64" y="510">Verification</tspan></text>
  </g>
