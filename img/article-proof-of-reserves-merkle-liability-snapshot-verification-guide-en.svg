<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Proof of Reserves PoR Verification Cover Diagram">
  <defs>
    <radialGradient id="glowPorEn" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softPorEn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridPorEn" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#070d14"/>
  <rect width="1200" height="600" fill="url(#gridPorEn)"/>
  
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0284c7"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">RE</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">Crypto Research · Research Foundations</text>
  </g>

  <circle cx="880" cy="280" r="240" fill="url(#glowPorEn)"/>

  <!-- Diagram: Merkle Sum Tree vs Negative Balance & Snapshot Loan -->
  <g transform="translate(610, 105)">
    <!-- Root Node -->
    <rect x="180" y="10" width="180" height="60" rx="12" fill="#0c1e2e" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="270" y="35" font-family="'Segoe UI',Consolas,monospace" font-size="13" font-weight="750" fill="#7dd3fc" text-anchor="middle">Merkle Sum Root</text>
    <text x="270" y="55" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Liabilities: 65,000 BTC</text>

    <!-- Connectors -->
    <line x1="270" y1="70" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="270" y1="70" x2="380" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Left Branch: Normal Users -->
    <rect x="80" y="120" width="160" height="52" rx="10" fill="#0c1b26" stroke="#0284c7" stroke-width="1.2"/>
    <text x="160" y="142" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle">Legitimate Users</text>
    <text x="160" y="160" font-family="'Segoe UI',Consolas,monospace" font-size="12" fill="#38bdf8" text-anchor="middle">+115,000 BTC</text>

    <!-- Right Branch: Negative Balance Smuggling -->
    <rect x="300" y="120" width="160" height="52" rx="10" fill="#260f15" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="380" y="142" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="750" fill="#fda4af" text-anchor="middle">Synthetic Negative Node</text>
    <text x="380" y="160" font-family="'Segoe UI',Consolas,monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">-50,000 BTC Offset</text>

    <!-- Warning / Timeline Box -->
    <g transform="translate(40, 205)">
      <rect x="0" y="0" width="460" height="75" rx="12" fill="#0b1722" stroke="#0284c7" stroke-width="1"/>
      <text x="20" y="26" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Snapshot Bridge Borrowing (Window Dressing)</text>
      <text x="20" y="48" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#94a3b8">Block N-2: Borrow 20,000 BTC from DeFi/OTC pool</text>
      <text x="20" y="66" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#f43f5e">Block N (PoR Snapshot) ➔ Block N+2: Immediate Repayment</text>
    </g>
  </g>

  <!-- Left Side Title Block -->
  <g transform="translate(64, 210)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#0c1e2e" stroke="#0284c7" stroke-width="1"/>
    <text x="40" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="750" fill="#38bdf8" text-anchor="middle">PoR Check</text>

    <text x="0" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan x="0" dy="0">Proof of Reserves Verification</tspan>
      <tspan x="0" dy="50" font-size="28" fill="#94a3b8">Merkle Liability Smuggling &amp; Snapshot Window Dressing</tspan>
    </text>

    <text x="0" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#64748b" line-height="1.6">
      <tspan x="0" dy="0">Without ZK non-negative range proofs, negative balances secretly erase liabilities;</tspan>
      <tspan x="0" dy="24">single-block snapshots are vulnerable to bridge loans. A complete audit guide.</tspan>
    </text>
  </g>
</svg>