<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EIP-7702 EOA委托账户存储碰撞与撤销残留核验 主题配图">
  <defs>
    <radialGradient id="glow7702Zh" cx="68%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid7702Zh" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#22d3ee" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#070d12"/>
  <rect width="1200" height="600" fill="url(#grid7702Zh)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0891b2"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="750" fill="#ffffff" text-anchor="middle">研</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">加密货币研究 · 协议与基础设施风险</text>
  </g>

  <circle cx="885" cy="285" r="245" fill="url(#glow7702Zh)"/>

  <!-- Diagram: EIP-7702 Delegation Pointer & Dirty Storage Collision -->
  <g transform="translate(615, 108)">
    <!-- Code Pointer Box -->
    <rect x="25" y="18" width="235" height="114" rx="14" fill="#0b1820" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="45" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#67e8f9">EOA Code (23 Bytes)</text>
    <text x="45" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">0xef0100 || Impl_B</text>
    <text x="45" y="106" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#22d3ee">撤销仅清空代码指针</text>

    <!-- Storage Collision Box -->
    <rect x="280" y="18" width="235" height="114" rx="14" fill="#1a0e14" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="300" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fda4af">EOA Storage Slot 0</text>
    <text x="300" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">Impl_A 残留脏数据仍在</text>
    <text x="300" y="106" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#fb7185">槽位碰撞 / 权限越权</text>

    <!-- Flow Diagram -->
    <g transform="translate(30, 162)">
      <rect x="0" y="0" width="136" height="44" rx="8" fill="#11242e" stroke="#0891b2" stroke-width="1.2"/>
      <text x="68" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">委托 Impl_A 写槽0</text>

      <path d="M 136 22 L 172 22" stroke="#67e8f9" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="178,22 170,18 170,26" fill="#67e8f9"/>

      <rect x="182" y="0" width="132" height="44" rx="8" fill="#18202c" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="248" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">切换至 Impl_B</text>

      <path d="M 314 22 L 350 22" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="356,22 348,18 348,26" fill="#f43f5e"/>

      <rect x="360" y="0" width="120" height="44" rx="8" fill="#221017" stroke="#e11d48" stroke-width="1.5"/>
      <text x="420" y="27" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="750" fill="#fda4af" text-anchor="middle">错读旧槽位接管</text>
    </g>

    <!-- Warning Pill -->
    <rect x="30" y="238" width="480" height="36" rx="8" fill="#121e26" stroke="#06b6d4" stroke-width="1"/>
    <text x="48" y="261" font-family="Consolas,'Segoe UI',monospace" font-size="12" font-weight="600" fill="#67e8f9">eth_getCode 核验 0xef0100 + ERC-7201 命名空间 + chainId != 0</text>
  </g>

  <!-- Left Side Title Block -->
  <g transform="translate(64, 206)">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#10252f" stroke="#06b6d4" stroke-width="1"/>
    <text x="46" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="750" fill="#22d3ee" text-anchor="middle">EIP-7702核验</text>

    <text x="0" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="33" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan x="0" dy="0">EIP-7702 委托账户核验</tspan>
      <tspan x="0" dy="50" font-size="27" fill="#94a3b8">EOA 存储槽位碰撞、跨链重放与撤销残留陷阱</tspan>
    </text>

    <text x="0" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#64748b">
      <tspan x="0" dy="0">Pectra 升级让普通 EOA 可通过 0xef0100 委托执行合约代码，但撤销授权不会清空</tspan>
      <tspan x="0" dy="24">EOA 持久存储，且 chain_id=0 与 tx.origin 假设失效正重构链上安全边界。</tspan>
    </text>
  </g>
</svg>