    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="230" r="230" fill="url(#glowvolzh)"/>
  <g filter="url(#softvolzh)">
    <path d="M700 300 Q740 220 780 280 T860 250 T940 200" fill="none" stroke="#3fa8a8" stroke-width="5" stroke-linecap="round"/>
    <path d="M700 260 Q740 300 780 240 T860 290 T940 260" fill="none" stroke="#2a6d6d" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
    <g transform="translate(940,320)">
