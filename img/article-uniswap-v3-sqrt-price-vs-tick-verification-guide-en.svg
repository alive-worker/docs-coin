<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#120d08"/>
  <text x="72" y="92" fill="#f6ead8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">one division is not the quote</text>
  <text x="72" y="142" fill="#c4a574" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">tick 200 still has to be squared</text>
  <rect x="72" y="200" width="400" height="230" rx="22" fill="none" stroke="#e0b15a" stroke-width="3"/>
  <text x="96" y="258" fill="#e0b15a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">divide by 2^96</text>
  <text x="96" y="350" fill="#f6ead8" font-family="Segoe UI, sans-serif" font-size="54" font-weight="700">1.01005</text>
  <rect x="528" y="268" width="144" height="144" rx="16" fill="none" stroke="#f0c674" stroke-width="3"/>
  <text x="600" y="352" text-anchor="middle" fill="#f0c674" font-family="Segoe UI, sans-serif" font-size="64" font-weight="700">x</text>
  <text x="600" y="448" text-anchor="middle" fill="#c4a574" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">square it</text>
  <rect x="728" y="200" width="400" height="230" rx="22" fill="#e0b15a"/>
  <text x="752" y="258" fill="#3a2408" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">quote</text>
  <text x="752" y="350" fill="#1a1008" font-family="Segoe UI, sans-serif" font-size="54" font-weight="700">1.02020</text>
  <text x="72" y="530" fill="#8d7352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26">10000 ticks are not 2</text>
  <text x="430" y="530" fill="#8d7352" font-family="Segoe UI, sans-serif" font-size="26" text-decoration="line-through">2.00000</text>
  <text x="620" y="530" fill="#f0c674" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">2.71815</text>
</svg>