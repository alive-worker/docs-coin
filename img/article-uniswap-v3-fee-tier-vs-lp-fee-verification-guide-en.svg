<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#140e0a"/>
  <text x="72" y="110" fill="#f4eadf" font-family="Georgia, serif" font-size="48" font-weight="700">The fee tier is not the LP cut</text>
  <text x="72" y="162" fill="#e0b483" font-family="Georgia, serif" font-size="26">The same 3000 leaves 2250 one way and 2500 the other</text>
  <rect x="72" y="210" width="480" height="250" rx="24" fill="none" stroke="#e0b483" stroke-width="3"/>
  <text x="100" y="262" fill="#c9a479" font-family="Georgia, serif" font-size="22">Gross fee</text>
  <text x="100" y="330" fill="#f4eadf" font-family="Georgia, serif" font-size="56" font-weight="700">3000</text>
  <text x="100" y="390" fill="#8a7560" font-family="Georgia, serif" font-size="22">feeProtocol = 100</text>
  <text x="100" y="428" fill="#8a7560" font-family="Georgia, serif" font-size="22">Low nibble 4, high nibble 6</text>
  <text x="620" y="250" fill="#c9a479" font-family="Georgia, serif" font-size="22">Denominator 4, LPs keep</text>
  <rect x="620" y="268" width="500" height="64" rx="16" fill="#e0b483"/>
  <text x="644" y="312" fill="#140e0a" font-family="Georgia, serif" font-size="36" font-weight="700">2250</text>
  <text x="620" y="390" fill="#c9a479" font-family="Georgia, serif" font-size="22">Denominator 6, LPs keep</text>
  <rect x="620" y="408" width="500" height="64" rx="16" fill="none" stroke="#e0b483" stroke-width="3"/>
  <text x="644" y="452" fill="#f4eadf" font-family="Georgia, serif" font-size="36" font-weight="700">2500</text>
  <text x="72" y="540" fill="#8a7560" font-family="Georgia, serif" font-size="22">Protocol takes 750 and 500. The printed 0.30% does not say which.</text>
</svg>
