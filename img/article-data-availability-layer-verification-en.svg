<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Availability Layer Verification: Sampling Passed Doesn't Mean Data Is Retrievable cover">
  <defs>
    <radialGradient id="daGlowEn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c34a" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#e8c34a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8c34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="daEdgeEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c34a"/>
      <stop offset="100%" stop-color="#9c7a1f"/>
    </linearGradient>
    <filter id="daSoftEn" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="daDotsEn" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#daDotsEn)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#e8c34a"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#e8c34a">DATA AVAILABILITY · SAMPLING &amp; ENCODING INTEGRITY</text>

  <g transform="translate(640,300)" filter="url(#daSoftEn)">
    <circle r="190" fill="url(#daGlowEn)" opacity="0.7"/>
    <g stroke="url(#daEdgeEn)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-170" y2="-70" stroke-dasharray="4 5"/>
      <line x1="0" y1="0" x2="170" y2="-70"/>
      <line x1="0" y1="0" x2="-170" y2="90" stroke-dasharray="4 5"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="170" y2="90" stroke-dasharray="4 5"/>
    </g>
    <rect x="-46" y="-46" width="92" height="92" rx="10" fill="#0c1620" stroke="#e8c34a" stroke-width="3"/>
    <text x="0" y="-4" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#e8c34a" text-anchor="middle">RAW DATA</text>
    <text x="0" y="16" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">erasure coded</text>
    <g fill="#111820" stroke="url(#daEdgeEn)" stroke-width="2">
      <circle cx="-170" cy="-70" r="26"/>
      <circle cx="170" cy="-70" r="26"/>
      <circle cx="-170" cy="90" r="26"/>
      <circle cx="0" cy="150" r="26"/>
      <circle cx="170" cy="90" r="26"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-170" y="-66">Shard A</text>
      <text x="170" y="-66">Shard B</text>
      <text x="-170" y="94">Shard C</text>
      <text x="0" y="154">Shard D</text>
      <text x="170" y="94">Shard E</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#e8c34a">Does a passed sample mean retrievable?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">DAS boundaries, erasure-coding errors, and trust-surface verification</text>
</svg>
