<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Audit Log Integrity Verification cover image">
  <defs>
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ab4f5" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8ab4f5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8ab4f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab4f5"/>
      <stop offset="100%" stop-color="#7f8fd9"/>
    </linearGradient>
    <filter id="aiSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="aiDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#aiDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#8ab4f5"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes · AI x On-Chain series (8)</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#8ab4f5">AGENT AUDIT LOG INTEGRITY VERIFICATION</text>

  <!-- central log node with integrity-proof chain -->
  <g transform="translate(640,300)" filter="url(#aiSoft)">
    <circle r="190" fill="url(#aiGlow)" opacity="0.7"/>
    <g stroke="url(#aiEdge)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-40"/>
      <line x1="0" y1="0" x2="176" y2="-40"/>
      <line x1="0" y1="0" x2="-140" y2="130"/>
      <line x1="0" y1="0" x2="140" y2="130"/>
    </g>
    <path d="M0,-70 L52,-42 L52,26 C52,72 26,100 0,116 C-26,100 -52,72 -52,26 L-52,-42 Z" fill="#0c1620" stroke="#8ab4f5" stroke-width="3"/>
    <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#8ab4f5" text-anchor="middle">LOG</text>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">RECORD</text>
    <g fill="#111820" stroke="url(#aiEdge)" stroke-width="2">
      <circle cx="-176" cy="-40" r="30"/>
      <circle cx="176" cy="-40" r="30"/>
      <circle cx="-140" cy="130" r="30"/>
      <circle cx="140" cy="130" r="30"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-37">HASH-CHAIN</text>
      <text x="176" y="-37">TIMESTAMP</text>
      <text x="-140" y="133">DELETION</text>
      <text x="140" y="133">ATTEST</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="36" fill="#8ab4f5">Who Proves It Wasn't Altered</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Log integrity proofs, silent-deletion detection and trusted timestamp sourcing</text>
</svg>
