<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链消息协议核验 主题配图">
  <defs>
    <radialGradient id="xmsgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9de0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#4a9de0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4a9de0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xmsgEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a9de0"/>
      <stop offset="100%" stop-color="#1f5c9c"/>
    </linearGradient>
    <filter id="xmsgSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="xmsgDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#xmsgDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#4a9de0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#4a9de0">跨链消息协议 · 验证与信任面核验</text>

  <!-- source-chain event relayed through oracle/relayer/DVN to destination chain -->
  <g transform="translate(640,300)" filter="url(#xmsgSoft)">
    <circle r="190" fill="url(#xmsgGlow)" opacity="0.7"/>
    <g stroke="url(#xmsgEdge)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-40"/>
      <line x1="0" y1="0" x2="176" y2="-40" stroke-dasharray="4 5"/>
      <line x1="0" y1="0" x2="-140" y2="130"/>
      <line x1="0" y1="0" x2="140" y2="130" stroke-dasharray="4 5"/>
    </g>
    <path d="M0,-70 L52,-42 L52,26 C52,72 26,100 0,116 C-26,100 -52,72 -52,26 L-52,-42 Z" fill="#0c1620" stroke="#4a9de0" stroke-width="3"/>
    <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#4a9de0" text-anchor="middle">消息</text>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">MSG</text>
    <g fill="#111820" stroke="url(#xmsgEdge)" stroke-width="2">
      <circle cx="-176" cy="-40" r="28"/>
      <circle cx="176" cy="-40" r="28"/>
      <circle cx="-140" cy="130" r="28"/>
      <circle cx="140" cy="130" r="28"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-36">预言机</text>
      <text x="176" y="-36">中继器</text>
      <text x="-140" y="134">DVN</text>
      <text x="140" y="134">目标链</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#4a9de0">谁来证明消息是真的</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">DVN多方验证、终局性冲突与信任面扩大核验方法</text>
</svg>
