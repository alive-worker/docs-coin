<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vetting an Offshore Crypto Exchange: Licenses and Custody cover image">
  <defs>
    <radialGradient id="ocGlowEn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ea0e8" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5ea0e8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ea0e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ocEdgeEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec2ff"/>
      <stop offset="100%" stop-color="#2f6fb0"/>
    </linearGradient>
    <filter id="ocSoftEn" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ocDotsEn" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#08090f"/>
  <rect width="1200" height="600" fill="url(#ocDotsEn)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ea0e8"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#08090f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ea0e8">OFFSHORE EXCHANGE · LICENSE AND CUSTODY CHECK</text>

  <g transform="translate(660,300)" filter="url(#ocSoftEn)">
    <circle r="190" fill="url(#ocGlowEn)" opacity="0.7"/>
    <rect x="-150" y="-120" width="220" height="260" rx="10" fill="#0d141f" stroke="url(#ocEdgeEn)" stroke-width="2"/>
    <g stroke="#7ec2ff" stroke-width="2" opacity="0.55">
      <line x1="-124" y1="-72" x2="30" y2="-72"/>
      <line x1="-124" y1="-40" x2="30" y2="-40"/>
      <line x1="-124" y1="-8" x2="30" y2="-8"/>
      <line x1="-124" y1="24" x2="30" y2="24"/>
      <line x1="-124" y1="56" x2="-10" y2="56"/>
    </g>
    <circle cx="-90" cy="90" r="30" fill="none" stroke="#ff6b81" stroke-width="3" stroke-dasharray="3 5"/>
    <text x="-90" y="96" font-family="'Consolas',monospace" font-size="11" font-weight="800" fill="#ff6b81" text-anchor="middle">?</text>
    <g transform="translate(95,20)">
      <circle r="58" fill="none" stroke="url(#ocEdgeEn)" stroke-width="7"/>
      <line x1="41" y1="41" x2="90" y2="90" stroke="url(#ocEdgeEn)" stroke-width="10" stroke-linecap="round"/>
      <path d="M-28,-6 L20,-6 M-28,14 L14,14" stroke="#c9d3e0" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="0" y="150" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#5ea0e8" text-anchor="middle">LICENSE REGISTRY</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="42" fill="#5ea0e8">Does the license hold up?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Verifying registers, entities, and reserve proofs before you sign up</text>
</svg>
