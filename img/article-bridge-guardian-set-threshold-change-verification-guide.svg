<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链桥验证者集阈值核验：多签门槛何时被调低 主题配图">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6cf0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#7c6cf0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a3fc0"/>
      <stop offset="100%" stop-color="#9a86f5"/>
    </linearGradient>
    <filter id="bgSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="bgDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#bgDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#7c6cf0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#7c6cf0">跨链桥验证者集 · 门槛与延迟核验</text>

  <!-- a bridge span held up by guardian-node pillars co-signing across a gap, one pillar breaking off with a dashed bypass, plus a threshold dial -->
  <g transform="translate(620,300)" filter="url(#bgSoft)">
    <circle r="210" fill="url(#bgGlow)" opacity="0.7"/>
    <path d="M-260,40 C-160,-60 160,-60 260,40" fill="none" stroke="url(#bgEdge)" stroke-width="4"/>
    <g stroke="url(#bgEdge)" stroke-width="1.5" opacity="0.8">
      <line x1="-195" y1="10" x2="-195" y2="90"/>
      <line x1="-98" y1="-38" x2="-98" y2="90"/>
      <line x1="0" y1="-56" x2="0" y2="90"/>
      <line x1="98" y1="-38" x2="98" y2="90"/>
      <line x1="195" y1="10" x2="195" y2="90" stroke-dasharray="4 5" stroke="#ff6b81"/>
    </g>
    <g fill="#111820" stroke="url(#bgEdge)" stroke-width="2">
      <circle cx="-195" cy="90" r="24"/>
      <circle cx="-98" cy="90" r="24"/>
      <circle cx="0" cy="90" r="24"/>
      <circle cx="98" cy="90" r="24"/>
      <circle cx="195" cy="90" r="24" stroke="#ff6b81"/>
    </g>
    <g font-family="'Consolas',monospace" font-size="10" font-weight="700" fill="#c9d3e0" text-anchor="middle">
      <text x="-195" y="94">G1</text>
      <text x="-98" y="94">G2</text>
      <text x="0" y="94">G3</text>
      <text x="98" y="94">G4</text>
      <text x="195" y="94" fill="#ff6b81">?</text>
    </g>
    <path d="M195,90 C260,120 270,180 220,205" fill="none" stroke="#ff6b81" stroke-width="2" stroke-dasharray="3 6" opacity="0.9"/>
    <text x="264" y="222" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#ff6b81">延迟窗口被跳过</text>
    <g transform="translate(-330,-30)">
      <circle r="58" fill="none" stroke="#3a3550" stroke-width="10"/>
      <path d="M0,-58 A58,58 0 1 1 -55,-15" fill="none" stroke="#7c6cf0" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="8" font-family="'Consolas',monospace" font-size="20" font-weight="800" fill="#e7e9f5" text-anchor="middle">13/19</text>
      <text x="0" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#7f8aa3" text-anchor="middle">当前门槛</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="44" fill="#7c6cf0">这座桥，还是原来的门槛吗</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">验证者名单、签名阈值与生效延迟的链上核验方法</text>
</svg>
