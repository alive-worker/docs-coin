<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="USDT发行与储备机制 主题配图">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5b342" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f5b342" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f5b342" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f5b342"/>
      <stop offset="100%" stop-color="#e07b3a"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="44" height="38" patternUnits="userSpaceOnUse">
      <path d="M22 2 L40 12 L40 32 L22 42 L4 32 L4 12 Z" fill="none" stroke="#f5b342" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#1a1408"/>
  <rect width="1200" height="600" fill="url(#hex)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f5b342"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1a1408" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#c9a878">加密货币研究</text>
  </g>

  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#f5b342">USDT 基础 · ISSUANCE · RESERVE · MINT / BURN</text>

  <g transform="translate(760,300)" filter="url(#softGlow)">
    <circle r="170" fill="url(#glow)"/>

    <!-- central USDT coin -->
    <circle cx="0" cy="0" r="70" fill="#211a0c" stroke="#f5b342" stroke-width="3"/>
    <text x="0" y="10" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#f5b342" text-anchor="middle">USDT</text>
    <text x="0" y="36" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#c9a878" text-anchor="middle">≈ $1.00</text>

    <!-- Bank reserve node -->
    <g transform="translate(-190,-95)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#211a0c" stroke="#c9a878" stroke-width="2"/>
      <path d="M14 20 L55 8 L96 20 L96 26 L14 26 Z" fill="none" stroke="#f5b342" stroke-width="1.6"/>
      <line x1="22" y1="30" x2="22" y2="48" stroke="#f5b342" stroke-width="1.6"/>
      <line x1="42" y1="30" x2="42" y2="48" stroke="#f5b342" stroke-width="1.6"/>
      <line x1="68" y1="30" x2="68" y2="48" stroke="#f5b342" stroke-width="1.6"/>
      <line x1="88" y1="30" x2="88" y2="48" stroke="#f5b342" stroke-width="1.6"/>
      <line x1="10" y1="52" x2="100" y2="52" stroke="#f5b342" stroke-width="2"/>
      <text x="55" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c9a878" text-anchor="middle">RESERVE $</text>
    </g>

    <!-- T-Bills / commercial paper -->
    <g transform="translate(-190,60)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#211a0c" stroke="#c9a878" stroke-width="2"/>
      <rect x="12" y="12" width="86" height="8" rx="2" fill="#f5b342" opacity="0.85"/>
      <rect x="12" y="26" width="70" height="8" rx="2" fill="#c9a878" opacity="0.75"/>
      <rect x="12" y="40" width="54" height="8" rx="2" fill="#c9a878" opacity="0.55"/>
      <text x="55" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c9a878" text-anchor="middle">T-BILLS</text>
    </g>

    <!-- MINT arrow -->
    <g transform="translate(110,-95)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#211a0c" stroke="#4fd8a5" stroke-width="2"/>
      <path d="M15 30 L85 30 M75 22 L85 30 L75 38" fill="none" stroke="#4fd8a5" stroke-width="3" stroke-linecap="round"/>
      <text x="55" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#4fd8a5" text-anchor="middle">MINT</text>
    </g>

    <!-- BURN arrow -->
    <g transform="translate(110,60)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="#211a0c" stroke="#e07b3a" stroke-width="2"/>
      <path d="M85 30 L15 30 M25 22 L15 30 L25 38" fill="none" stroke="#e07b3a" stroke-width="3" stroke-linecap="round"/>
      <text x="55" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#e07b3a" text-anchor="middle">BURN</text>
    </g>

    <!-- connecting lines -->
    <line x1="-80" y1="-65" x2="-58" y2="-32" stroke="#c9a878" stroke-width="1.5" stroke-dasharray="2 6"/>
    <line x1="-80" y1="90" x2="-58" y2="32" stroke="#c9a878" stroke-width="1.5" stroke-dasharray="2 6"/>
    <line x1="110" y1="-65" x2="58" y2="-32" stroke="#4fd8a5" stroke-width="1.6" stroke-dasharray="2 6"/>
    <line x1="110" y1="90" x2="58" y2="32" stroke="#e07b3a" stroke-width="1.6" stroke-dasharray="2 6"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="482" font-size="46" fill="#f5b342">USDT发行与储备机制深度拆解</text>
  </g>
  <text x="64" y="522" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#c9a878">USDT的基础 · 铸造与销毁 · 储备结构 · 链上锚定 · 研究者视角</text>
</svg>
