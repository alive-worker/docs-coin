<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NFT Floor Price and Market Cap Verification cover image">
  <defs>
    <radialGradient id="glownfen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a8bd6" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#4a8bd6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#4a8bd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softnfen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsnfen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsnfen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#4a8bd6"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="230" r="230" fill="url(#glownfen)"/>
  <g filter="url(#softnfen)">
    <rect x="750" y="140" width="90" height="90" rx="10" fill="#4a8bd6" opacity="0.85"/>
    <rect x="790" y="200" width="90" height="90" rx="10" fill="#4a8bd6" opacity="0.5"/>
    <g transform="translate(940,320)">
      <rect x="-72" y="-58" width="144" height="116" rx="14" fill="#10161f" stroke="#4a8bd6" stroke-width="2.5" opacity="0.9"/>
      <text x="0" y="8" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#4a8bd6" text-anchor="middle">FLOOR</text>
    </g>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="32" fill="#4a8bd6"><tspan x="64" y="460">NFT Floor Price Verification</tspan></text>
  </g>
  <text x="64" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#7f8aa3">How far the displayed floor is from real sale prices</text>
</svg>
