<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换手续费怎么省：拆单前先看清费用结构 主题配图">
  <defs>
    <radialGradient id="foGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="foSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="foDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#foDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">费用拆解 · 路径比较 · 拥堵择时</text>

  <!-- descending cost curve with two branch routes and a balance/scale comparing fixed vs percentage fees -->
  <g transform="translate(640,300)" filter="url(#foSoft)">
    <circle r="200" fill="url(#foGlow)" opacity="0.7"/>

    <g transform="translate(0,-6)">
      <!-- balance scale: fixed fee (left, heavier at small n) vs percentage fee (right, flat) -->
      <line x1="-170" y1="-70" x2="170" y2="-70" stroke="#3a4258" stroke-width="3"/>
      <circle cx="0" cy="-70" r="6" fill="#5ec8e0"/>
      <line x1="0" y1="-70" x2="0" y2="-96" stroke="#5ec8e0" stroke-width="3"/>

      <g transform="translate(-150,-40)">
        <path d="M -30 0 L 0 -30 L 30 0 Z" fill="none" stroke="#f0663f" stroke-width="2.5" opacity="0.85"/>
        <circle r="26" fill="#111820" stroke="#f0663f" stroke-width="3"/>
        <text x="0" y="6" font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#f0663f" text-anchor="middle">固定</text>
        <text x="0" y="50" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">合并大额更省</text>
      </g>

      <g transform="translate(150,-40)">
        <path d="M -30 0 L 0 -14 L 30 0 Z" fill="none" stroke="#4fd8a5" stroke-width="2.5" opacity="0.85"/>
        <circle r="26" fill="#111820" stroke="#4fd8a5" stroke-width="3"/>
        <text x="0" y="6" font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#4fd8a5" text-anchor="middle">比例</text>
        <text x="0" y="50" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">拆分基本无感</text>
      </g>

      <!-- descending cost curve with markers at branch points -->
      <path d="M -160 70 C -80 66, -40 90, 0 78 S 90 40, 160 20" fill="none" stroke="url(#foEdge)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-160" cy="70" r="5" fill="#f0b64a"/>
      <circle cx="0" cy="78" r="5" fill="#f0b64a"/>
      <circle cx="160" cy="20" r="5" fill="#f0b64a"/>
      <text x="0" y="102" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">网络路径 · 拥堵择时 = 成本曲线</text>
    </g>

    <rect x="-160" y="150" width="320" height="88" rx="12" fill="#111820" stroke="url(#foEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">Gas层 · 服务费层 · 汇率价差层</text>
      <text x="0" y="192">网络组合 · 择时 · 识破零手续费话术</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">先分层，再决定拆不拆、换不换</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#5ec8e0">拆单前先看清费用结构</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">跨链兑换手续费优化：固定费用、比例费用与路径择时</text>
</svg>
