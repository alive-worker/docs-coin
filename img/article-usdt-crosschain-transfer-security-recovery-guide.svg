<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="USDT跨链转账安全指南封面图">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fe3b3" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#5fe3b3" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5fe3b3" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <!-- brand -->
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5fe3b3"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密研究笔记</text>
  </g>

  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5fe3b3">USDT 跨链安全 · 桥接核验 · 防骗</text>

  <!-- cross-chain bridge diagram -->
  <g transform="translate(700,290)" filter="url(#softGlow)">
    <circle r="140" fill="url(#nodeGlow)"/>
    <!-- Chain A -->
    <circle cx="-190" cy="0" r="44" fill="#111820" stroke="#5fe3b3" stroke-width="2.5"/>
    <text x="-190" y="-10" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5fe3b3" text-anchor="middle">Chain A</text>
    <text x="-190" y="10" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#5fe3b3" text-anchor="middle">₮</text>
    <!-- Bridge node -->
    <circle cx="0" cy="0" r="36" fill="#111820" stroke="#f0c040" stroke-width="2.5"/>
    <text x="0" y="-7" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#f0c040" text-anchor="middle">BRIDGE</text>
    <text x="0" y="12" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#f0c040" text-anchor="middle">&#x21C4;</text>
    <!-- Chain B -->
    <circle cx="190" cy="0" r="44" fill="#111820" stroke="#5fe3b3" stroke-width="2.5"/>
    <text x="190" y="-10" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5fe3b3" text-anchor="middle">Chain B</text>
    <text x="190" y="10" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#5fe3b3" text-anchor="middle">₮</text>
    <!-- connectors -->
    <line x1="-146" y1="0" x2="-36" y2="0" stroke="#5fe3b3" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>
    <line x1="36" y1="0" x2="146" y2="0" stroke="#5fe3b3" stroke-width="2" stroke-dasharray="4 6" opacity="0.8"/>
    <!-- labels -->
    <text x="-190" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9aa7bd" text-anchor="middle">ERC20 / TRC20</text>
    <text x="190" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#9aa7bd" text-anchor="middle">目标网络</text>
    <text x="0" y="58" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#f0c040" text-anchor="middle">核验合约</text>
    <!-- shield -->
    <circle cx="0" cy="-86" r="18" fill="#0a0a0f" stroke="#5fe3b3" stroke-width="1.5"/>
    <text x="0" y="-80" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#5fe3b3" text-anchor="middle">&#x2713;</text>
  </g>

  <!-- headline -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="492" font-size="42" fill="#5fe3b3">USDT跨链转账安全指南</text>
  </g>
  <text x="64" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#7f8aa3">网络选择 · 桥接核验 · 找回骗局防范 · 延迟处置</text>
</svg>
