<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="交易所资产再抵押风险：你存的币，可能正被借给别人用 主题配图">
  <defs>
    <radialGradient id="glowrehyzh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2b49c" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#f2b49c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#f2b49c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softrehyzh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsrehyzh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsrehyzh)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f2b49c"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowrehyzh)"/>
  <g filter="url(#softrehyzh)">
