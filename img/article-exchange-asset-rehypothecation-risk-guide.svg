    <text x="765" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#f2b49c" text-anchor="middle">你</text>
    <path d="M840 205 L920 205" stroke="#f2b49c" stroke-width="3" stroke-dasharray="4 6"/>
    <path d="M904 191 l16 14 l-16 14" fill="none" stroke="#f2b49c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="940" y="120" width="130" height="170" rx="14" fill="#10161f" stroke="#f2b49c" stroke-width="2.5" opacity="0.6"/>
    <text x="1005" y="215" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#f2b49c" text-anchor="middle" opacity="0.85">?</text>
    <path d="M860 300 L900 340 M900 300 L860 340" stroke="#f2b49c" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
