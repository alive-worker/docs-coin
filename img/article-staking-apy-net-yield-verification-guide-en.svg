<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Staking APY net yield verification cover image">
  <defs>
    <radialGradient id="glowapyen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b03f" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#e0b03f" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#e0b03f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softapyen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsapyen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsapyen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#e0b03f"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">C</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowapyen)"/>
  <g filter="url(#softapyen)">
    <path d="M700 300 L760 220 L820 250 L900 140" fill="none" stroke="#e0b03f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="700" cy="300" r="8" fill="#e0b03f"/>
    <circle cx="760" cy="220" r="8" fill="#e0b03f"/>
    <circle cx="820" cy="250" r="8" fill="#e0b03f"/>
    <circle cx="900" cy="140" r="10" fill="#e0b03f"/>
    <g transform="translate(940,300)">
      <rect x="-70" y="-60" width="140" height="120" rx="14" fill="#10161f" stroke="#e0b03f" stroke-width="2.5" opacity="0.9"/>
      <text x="0" y="10" font-family="'Segoe UI',Arial,sans-serif" font-size="34" font-weight="800" fill="#e0b03f" text-anchor="middle">%</text>
    </g>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="42" fill="#e0b03f"><tspan x="64" y="460">Staking APY Net Yield</tspan><tspan x="64" y="510">Verification</tspan></text>
  </g>
  <text x="64" y="546" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#7f8aa3">Advertised rate vs. what you actually earn</text>
</svg>
