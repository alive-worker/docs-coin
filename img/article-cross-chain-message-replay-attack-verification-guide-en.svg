<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-chain message replay verification guide theme illustration">
  <defs>
    <radialGradient id="glowrpen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8c9a0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#a8c9a0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a8c9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softrpen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsrpen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsrpen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#a8c9a0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">CR</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowrpen)"/>
  <g filter="url(#softrpen)">
    <g transform="translate(760,190)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#10161f" stroke="#a8c9a0" stroke-width="3"/>
      <text x="0" y="8" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#a8c9a0" text-anchor="middle">MSG</text>
    </g>
    <path d="M815 190 L900 190" stroke="#a8c9a0" stroke-width="4" stroke-dasharray="2 8"/>
    <path d="M880 175 L900 190 L880 205" fill="none" stroke="#a8c9a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(970,150)">
      <rect x="-55" y="-30" width="110" height="60" rx="8" fill="none" stroke="#a8c9a0" stroke-width="3" opacity="0.5"/>
    </g>
    <g transform="translate(970,230)">
      <rect x="-55" y="-30" width="110" height="60" rx="8" fill="none" stroke="#a8c9a0" stroke-width="3" opacity="0.5"/>
    </g>
    <text x="970" y="204" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#a8c9a0" text-anchor="middle" opacity="0.7">×2?</text>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="32" fill="#a8c9a0"><tspan x="64" y="460">Cross-Chain Message Replay</tspan><tspan x="64" y="510">Verification</tspan></text>
