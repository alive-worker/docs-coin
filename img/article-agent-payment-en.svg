<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent-to-agent settlement and credit chain cover image">
  <defs>
    <radialGradient id="apGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0916a" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f0916a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f0916a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0916a"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <linearGradient id="apFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f8fd9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0916a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f0916a" stop-opacity="0"/>
    </linearGradient>
    <filter id="apSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="apDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#apDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#f0916a"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes · AI x On-Chain (4)</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#f0916a">Agent-to-Agent Settlement · Credit Chain</text>

  <!-- left: agent A -->
  <g transform="translate(190,300)" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#c9d3e0" text-anchor="middle">
    <rect x="-76" y="-70" width="152" height="140" rx="16" fill="#111820" stroke="url(#apEdge)" stroke-width="2.5"/>
    <circle cx="0" cy="-28" r="18" fill="none" stroke="#f0916a" stroke-width="2.5"/>
    <path d="M-14 -14 a14 14 0 0 1 28 0" fill="none" stroke="#f0916a" stroke-width="2.5"/>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="12" font-weight="700" fill="#f0916a">Agent A</text>
    <text x="0" y="42" font-size="11" fill="#7f8aa3">spend cap</text>
  </g>

  <!-- flow lines: request / payment -->
  <g stroke="url(#apFlow)" stroke-width="3" fill="none">
    <path d="M266 276 C 380 250 440 260 560 288"/>
    <path d="M266 324 C 380 350 440 340 560 312"/>
  </g>

  <!-- central settlement / escrow core -->
  <g transform="translate(640,300)" filter="url(#apSoft)">
    <circle r="150" fill="url(#apGlow)" opacity="0.7"/>
    <rect x="-74" y="-74" width="148" height="148" rx="20" fill="#1a120c" stroke="#f0916a" stroke-width="3"/>
    <g stroke="url(#apEdge)" stroke-width="1.5" opacity="0.75">
      <path d="M-40 -40 L40 40 M40 -40 L-40 40"/>
      <circle cx="0" cy="0" r="44" fill="none"/>
    </g>
    <g fill="#f0916a">
      <circle cx="0" cy="-52" r="5"/><circle cx="0" cy="52" r="5"/>
      <circle cx="-52" cy="0" r="5"/><circle cx="52" cy="0" r="5"/>
    </g>
    <text x="0" y="-96" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#f0916a" text-anchor="middle">escrow / settlement</text>
  </g>

  <!-- right: agent B -->
  <g stroke="url(#apFlow)" stroke-width="3" fill="none">
    <path d="M714 288 C 820 260 880 270 986 296"/>
    <path d="M714 312 C 820 340 880 330 986 304"/>
  </g>
  <g transform="translate(1050,300)" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#c9d3e0" text-anchor="middle">
    <rect x="-70" y="-64" width="140" height="128" rx="16" fill="#111820" stroke="url(#apEdge)" stroke-width="2.5"/>
    <circle cx="0" cy="-24" r="16" fill="none" stroke="#6f8fd9" stroke-width="2.5"/>
    <path d="M-12 -12 a12 12 0 0 1 24 0" fill="none" stroke="#6f8fd9" stroke-width="2.5"/>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="12" font-weight="700" fill="#6f8fd9">Agent B</text>
    <text x="0" y="40" font-size="10" fill="#7f8aa3">service</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="42" fill="#f0916a">When Agents Pay Agents</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Verifying credit chains, delegated authority and runaway loops</text>
</svg>
