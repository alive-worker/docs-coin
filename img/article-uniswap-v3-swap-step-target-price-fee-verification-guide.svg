<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">单步核验：打到目标按吃进量进一</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26">computeSwapStep 手续费支路分叉：打到需 1002，1001 走未打到分支</text>
  
  <!-- Hit box -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">打到目标价（达到 tickNext）</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">吃进 998，手续费进一为 4</text>
  <text x="94" y="370" fill="#7dcea0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">总付 1002</text>
  <text x="360" y="370" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">（剩余转下一步）</text>

  <!-- Miss box -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">未打到目标价（传入 1001）</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">1001 * 997000 / 1e6 向下截断</text>
  <text x="666" y="370" fill="#e07a7a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">吃进 997</text>
  <text x="890" y="370" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">（手续费 4，耗尽）</text>

  <text x="64" y="520" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">⚠️ 差 1 wei 无法打满目标价格，无法触发 cross 穿档流动性更新</text>
</svg>