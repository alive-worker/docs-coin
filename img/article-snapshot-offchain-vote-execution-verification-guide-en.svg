<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Off-Chain Governance Vote Execution Verification Guide cover">
  <defs>
    <radialGradient id="svenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c060e0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#c060e0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c060e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svenEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c060e0"/>
      <stop offset="100%" stop-color="#7a3fc0"/>
    </linearGradient>
    <filter id="svenSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="svenDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#svenDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#c060e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#c060e0">OFF-CHAIN VOTE · SNAPSHOT VS ON-CHAIN EXECUTION</text>

  <g filter="url(#svenSoft)">
    <circle cx="430" cy="300" r="170" fill="url(#svenGlow)" opacity="0.7"/>
    <g transform="translate(430,300)">
      <path d="M-90,10 a50,50 0 0,1 8,-98 a62,62 0 0,1 118,-10 a46,46 0 0,1 4,108 z" fill="#141222" stroke="#c060e0" stroke-width="3"/>
      <g font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#c060e0" text-anchor="middle">
        <text x="0" y="-6">SNAPSHOT</text>
        <text x="0" y="16">off-chain · gasless</text>
      </g>
      <g font-family="'Consolas',monospace" font-size="11" fill="#c9d3e0" text-anchor="middle">
        <text x="0" y="40">quorum: 4.2M / 12M</text>
      </g>
    </g>

    <path d="M540,300 C650,260 720,260 800,300" fill="none" stroke="#ff6b81" stroke-width="2.5" stroke-dasharray="4 7" opacity="0.9"/>
    <circle cx="670" cy="272" r="20" fill="#0c1620" stroke="#ff6b81" stroke-width="2.5"/>
    <text x="670" y="278" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#ff6b81" text-anchor="middle">?</text>

    <g transform="translate(870,300)">
      <rect x="-70" y="-70" width="140" height="140" rx="16" fill="#141222" stroke="url(#svenEdge)" stroke-width="3"/>
      <rect x="-40" y="-30" width="80" height="14" rx="3" fill="#7a3fc0"/>
      <rect x="-40" y="-6" width="52" height="10" rx="3" fill="#3a2a5a"/>
      <rect x="-40" y="14" width="64" height="10" rx="3" fill="#3a2a5a"/>
      <text x="0" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#c060e0" text-anchor="middle">ON-CHAIN EXEC</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="40" fill="#c060e0">The vote passed. Then what?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Verifying calldata, snapshot-block timing, and quorum math</text>
</svg>
