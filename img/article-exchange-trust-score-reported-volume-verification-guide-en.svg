<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Exchange Trust Score vs. Reported Volume Verification cover image">
  <defs>
    <radialGradient id="glowtsen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a6fd6" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#8a6fd6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8a6fd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softtsen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotstsen" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotstsen)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#8a6fd6"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowtsen)"/>
  <g filter="url(#softtsen)">
    <rect x="700" y="260" width="30" height="90" rx="4" fill="#8a6fd6" opacity="0.55"/>
    <rect x="745" y="210" width="30" height="140" rx="4" fill="#8a6fd6" opacity="0.75"/>
    <rect x="790" y="150" width="30" height="200" rx="4" fill="#8a6fd6"/>
    <rect x="835" y="230" width="30" height="120" rx="4" fill="#8a6fd6" opacity="0.4"/>
