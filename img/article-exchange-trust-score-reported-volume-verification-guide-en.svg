      <text x="0" y="8" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#8a6fd6" text-anchor="middle">TRUST</text>
    </g>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="34" fill="#8a6fd6"><tspan x="64" y="460">Exchange Trust Score Verification</tspan></text>
  </g>
  <text x="64" y="500" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#7f8aa3">How much of the reported 24h volume is real liquidity</text>
