<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="小币种跨链兑换：流动性薄，仿冒币多 主题配图">
  <defs>
    <radialGradient id="ltGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ltEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="ltSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ltDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#ltDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 跨链兑换实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">合约核验 · 池深检测 · 仿冒预警</text>

  <!-- shallow liquidity pool with warning ripple, plus two look-alike coin icons (one flagged fake) -->
  <g transform="translate(640,300)" filter="url(#ltSoft)">
    <circle r="200" fill="url(#ltGlow)" opacity="0.7"/>

    <g transform="translate(0,-30)">
      <!-- two coins: genuine (left) vs fake (right, flagged) -->
      <g transform="translate(-110,0)">
        <circle r="42" fill="#111820" stroke="url(#ltEdge)" stroke-width="3"/>
        <text x="0" y="8" font-family="'Consolas',monospace" font-size="20" font-weight="700" fill="#4fd8a5" text-anchor="middle">✓</text>
        <text x="0" y="66" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">官方合约</text>
      </g>
      <g transform="translate(110,0)">
        <circle r="42" fill="#111820" stroke="#f0663f" stroke-width="3" stroke-dasharray="5 4"/>
        <text x="0" y="8" font-family="'Consolas',monospace" font-size="20" font-weight="700" fill="#f0663f" text-anchor="middle">✕</text>
        <text x="0" y="66" font-family="'Consolas',monospace" font-size="11" fill="#f0663f" text-anchor="middle">仿冒合约</text>
      </g>
      <line x1="-68" y1="0" x2="68" y2="0" stroke="#3a4258" stroke-width="2" stroke-dasharray="3 4"/>
      <text x="0" y="-56" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">同名同符号 · 只有地址不同</text>
    </g>

    <!-- shallow pool with ripple -->
    <g transform="translate(0,150)">
      <path d="M -170 -10 Q -85 30 0 -10 Q 85 -50 170 -10 L 170 40 L -170 40 Z" fill="#111820" stroke="url(#ltEdge)" stroke-width="2.5" opacity="0.9"/>
      <circle cx="0" cy="-14" r="30" fill="none" stroke="#f0b64a" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="-14" r="46" fill="none" stroke="#f0b64a" stroke-width="1.5" opacity="0.45"/>
      <text x="0" y="-10" font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#f0b64a" text-anchor="middle">!</text>
      <text x="0" y="70" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">薄池深度 · 价格冲击远超滑点</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#5ec8e0">流动性薄，仿冒币多</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">小币种跨链兑换：合约地址核验与流动性池深度检查</text>
</svg>
