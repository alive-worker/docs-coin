<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intent-Centric Trading and Solver Network Verification cover image">
  <defs>
    <radialGradient id="icsGlowEn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fe0ea" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#7fe0ea" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7fe0ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icsEdgeEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe0ea"/>
      <stop offset="100%" stop-color="#4f9aa8"/>
    </linearGradient>
    <filter id="icsSoftEn" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="icsDotsEn" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#icsDotsEn)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#7fe0ea"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#7fe0ea">INTENT-CENTRIC TRADING · SOLVER VERIFICATION</text>

  <!-- network graph: intent broadcast -> competing solvers -> settlement -->
  <g transform="translate(640,300)" filter="url(#icsSoftEn)">
    <circle r="190" fill="url(#icsGlowEn)" opacity="0.7"/>
    <g stroke="url(#icsEdgeEn)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-40"/>
      <line x1="0" y1="0" x2="176" y2="-40"/>
      <line x1="0" y1="0" x2="-140" y2="130"/>
      <line x1="0" y1="0" x2="140" y2="130"/>
      <line x1="-176" y1="-40" x2="176" y2="-40" stroke-dasharray="2 6"/>
      <line x1="-140" y1="130" x2="140" y2="130" stroke-dasharray="2 6"/>
    </g>
    <path d="M0,-70 L52,-42 L52,26 C52,72 26,100 0,116 C-26,100 -52,72 -52,26 L-52,-42 Z" fill="#0c1620" stroke="#7fe0ea" stroke-width="3"/>
    <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#7fe0ea" text-anchor="middle">INTENT</text>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">SIGNED</text>
    <g fill="#111820" stroke="url(#icsEdgeEn)" stroke-width="2">
      <circle cx="-176" cy="-40" r="28"/>
      <circle cx="176" cy="-40" r="28"/>
      <circle cx="-140" cy="130" r="28"/>
      <circle cx="140" cy="130" r="28"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-36">SOLVER A</text>
      <text x="176" y="-36">SOLVER B</text>
      <text x="-140" y="134">BATCH AUCTION</text>
      <text x="140" y="134">SETTLEMENT</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="42" fill="#7fe0ea">Who Routes the Order</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Verifying solver competition, batch auctions, and execution quality</text>
</svg>
