<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换前先测一笔：大额转账前该验证什么 主题配图">
  <defs>
    <radialGradient id="drGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="drSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="drDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#drDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">跨链兑换 · 小额预演 · 大额前置核验</text>

  <!-- small test dot scaling up to a large bar, gated by a checklist -->
  <g transform="translate(640,300)" filter="url(#drSoft)">
    <circle r="200" fill="url(#drGlow)" opacity="0.7"/>

    <!-- ascending size steps: small test -> gated -> large transfer -->
    <g transform="translate(0,20)">
      <circle cx="-190" cy="40" r="10" fill="#111820" stroke="#5ec8e0" stroke-width="3"/>
      <text x="-190" y="70" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">测试</text>

      <path d="M -170 40 L -70 40" stroke="url(#drEdge)" stroke-width="3" stroke-dasharray="4 8" fill="none"/>

      <!-- gate / checkpoint -->
      <g transform="translate(-20,40)">
        <rect x="-42" y="-42" width="84" height="84" rx="14" fill="#111820" stroke="#f0b64a" stroke-width="3"/>
        <path d="M -16 0 L -4 14 L 18 -14" stroke="#f0b64a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <path d="M 22 40 L 130 40" stroke="url(#drEdge)" stroke-width="3" fill="none"/>
      <path d="M 122 30 L 138 40 L 122 50" stroke="#4fd8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <circle cx="190" cy="40" r="34" fill="#111820" stroke="#4fd8a5" stroke-width="3"/>
      <text x="190" y="90" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">大额转账</text>
    </g>

    <rect x="-120" y="150" width="240" height="88" rx="12" fill="#111820" stroke="url(#drEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">链 · 合约地址 · 精度</text>
      <text x="0" y="192">到账时间 · 实付手续费</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">4 项核对通过再放大</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="40" fill="#5ec8e0">大额转账前该验证什么</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">跨链兑换路径预演：先测一笔，排掉隐患</text>
</svg>
