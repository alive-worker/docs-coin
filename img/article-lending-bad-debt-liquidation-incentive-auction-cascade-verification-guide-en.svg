<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lending Bad Debt Check: Liquidation Bonus Inversion and DEX Liquidity Cliffs Diagram">
  <defs>
    <radialGradient id="glowLiqEn" cx="68%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridLiqEn" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#fbbf24" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0b0c10"/>
  <rect width="1200" height="600" fill="url(#gridLiqEn)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#d97706"/>
    <text x="18" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="750" fill="#ffffff" text-anchor="middle">CR</text>
    <text x="46" y="24" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="650" fill="#94a3b8">Crypto Research · Market Structure &amp; Liquidity</text>
  </g>

  <circle cx="885" cy="285" r="245" fill="url(#glowLiqEn)"/>

  <!-- Diagram: Liquidation Bonus Inversion & DEX Liquidity Cliff -->
  <g transform="translate(610, 106)">
    <!-- Safety Buffer Box -->
    <rect x="25" y="18" width="238" height="114" rx="14" fill="#18140d" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="45" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fcd34d">True Buffer 1 - LT*(1+LB)</text>
    <text x="45" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">LT=90%, LB=7.5% → 3.25%</text>
    <text x="45" y="106" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#fbbf24">Not a 10% Margin</text>

    <!-- Bad Debt Inversion Box -->
    <rect x="282" y="18" width="238" height="114" rx="14" fill="#1b0f13" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="302" y="50" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#fda4af">Bonus Inversion Point</text>
    <text x="302" y="76" font-family="Consolas,'Segoe UI',monospace" font-size="12" fill="#94a3b8">Slippage + MEV &gt; LB</text>
    <text x="302" y="106" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="800" fill="#fb7185">Liquidators Halt → Debt</text>

    <!-- Cascade Flow -->
    <g transform="translate(28, 162)">
      <rect x="0" y="0" width="136" height="44" rx="8" fill="#20190e" stroke="#d97706" stroke-width="1.2"/>
      <text x="68" y="27" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#fcd34d" text-anchor="middle">HF &lt; 0.95 100% Close</text>

      <path d="M 136 22 L 172 22" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="178,22 170,18 170,26" fill="#fbbf24"/>

      <rect x="182" y="0" width="134" height="44" rx="8" fill="#231812" stroke="#f97316" stroke-width="1.2"/>
      <text x="249" y="27" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#fdba74" text-anchor="middle">DEX Liquidity Cliff</text>

      <path d="M 316 22 L 352 22" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="358,22 350,18 350,26" fill="#f43f5e"/>

      <rect x="362" y="0" width="124" height="44" rx="8" fill="#241016" stroke="#e11d48" stroke-width="1.5"/>
      <text x="424" y="27" font-family="'Segoe UI',sans-serif" font-size="11.5" font-weight="750" fill="#fda4af" text-anchor="middle">Cascade &amp; Fake APY</text>
    </g>

    <!-- Formula Pill -->
    <rect x="28" y="238" width="490" height="36" rx="8" fill="#171410" stroke="#f59e0b" stroke-width="1"/>
    <text x="46" y="261" font-family="Consolas,'Segoe UI',monospace" font-size="11.5" font-weight="600" fill="#fcd34d">Check: PriceImpact(Q_liq) &lt; LB - 0.5% &amp; Zero-Collateral Debt &lt; Reserve</text>
  </g>

  <!-- Left Side Title Block -->
  <g transform="translate(64, 206)">
    <rect x="0" y="0" width="104" height="26" rx="6" fill="#241b0c" stroke="#f59e0b" stroke-width="1"/>
    <text x="52" y="17" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="750" fill="#fbbf24" text-anchor="middle">Liquidation</text>

    <text x="0" y="72" font-family="'Segoe UI',Arial,sans-serif" font-size="31" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      <tspan x="0" dy="0">Lending Bad Debt Check</tspan>
      <tspan x="0" dy="46" font-size="25" fill="#94a3b8">Bonus Inversion &amp; DEX Liquidity Cliffs</tspan>
    </text>

    <text x="0" y="192" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#9ca3af">
      <tspan x="0" dy="0">Bad debt starts before LTV hits 100%: once slippage exceeds the bonus</tspan>
      <tspan x="0" dy="24">or breaches 1 - LT*(1+LB), liquidators halt and bad debt inflates APY.</tspan>
    </text>
  </g>
</svg>