<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="现货与合约基差交易：年化20%的「无风险」套利，风险到底藏在哪 主题配图">
  <defs>
    <radialGradient id="glowbasiszh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eddb78" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#eddb78" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#eddb78" stop-opacity="0"/>
    </radialGradient>
    <filter id="softbasiszh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotsbasiszh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dotsbasiszh)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#eddb78"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <circle cx="900" cy="210" r="230" fill="url(#glowbasiszh)"/>
  <g filter="url(#softbasiszh)">
    <path d="M680 280 L760 200 L840 240 L920 140" fill="none" stroke="#eddb78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M680 280 L760 300 L840 260 L920 320" fill="none" stroke="#eddb78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" stroke-dasharray="3 8"/>
    <circle cx="680" cy="280" r="7" fill="#eddb78"/>
    <circle cx="920" cy="140" r="7" fill="#eddb78"/>
    <circle cx="920" cy="320" r="7" fill="#eddb78" opacity="0.55"/>
    <g transform="translate(1000,230)">
      <rect x="-56" y="-40" width="112" height="80" rx="12" fill="#10161f" stroke="#eddb78" stroke-width="2.5"/>
      <text x="0" y="8" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#eddb78" text-anchor="middle">20%?</text>
    </g>
  </g>
  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text font-size="48" fill="#eddb78"><tspan x="64" y="470">现货与合约基差交易</tspan></text>
  </g>
  <text x="64" y="506" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#7f8aa3">「无风险」套利，风险到底藏在哪</text>
</svg>
