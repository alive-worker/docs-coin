<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0a1628"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#38bdf8" text-anchor="middle">DeFi Flash Loan Attack &amp; Defense</text>
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="17" fill="#7dd3fc" text-anchor="middle">One Transaction · Atomic Loop · On-Chain Security</text>

  <!-- Attack loop: four nodes connected in a cycle -->
  <line x1="270" y1="250" x2="500" y2="250" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="8,5" opacity="0.7"/>
  <line x1="500" y1="250" x2="730" y2="250" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="8,5" opacity="0.7"/>
  <line x1="730" y1="250" x2="960" y2="250" stroke="url(#flowLine)" stroke-width="2" stroke-dasharray="8,5" opacity="0.7"/>
  <path d="M 960 250 Q 990 400 615 400 Q 240 400 270 250" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.55"/>
  <text x="615" y="420" font-family="monospace" font-size="12" fill="#f87171" text-anchor="middle">atomic tx · closed loop in one transaction</text>

  <!-- Node 1: Borrow -->
  <circle cx="270" cy="250" r="46" fill="url(#nodeGlow)" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="270" y="256" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Borrow</text>
  <text x="270" y="180" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">01</text>

  <!-- Node 2: Manipulate -->
  <circle cx="500" cy="250" r="46" fill="url(#nodeGlow)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="500" y="256" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Manipulate</text>
  <text x="500" y="180" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">02</text>

  <!-- Node 3: Arbitrage -->
  <circle cx="730" cy="250" r="46" fill="url(#nodeGlow)" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="730" y="256" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Arbitrage</text>
  <text x="730" y="180" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">03</text>

  <!-- Node 4: Repay -->
  <circle cx="960" cy="250" r="46" fill="#0a1628" stroke="#ef4444" stroke-width="2.5"/>
  <text x="960" y="256" font-family="Arial, sans-serif" font-size="13" fill="#f87171" text-anchor="middle">Repay</text>
  <text x="960" y="180" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">04</text>

  <!-- Oracle vulnerability node -->
  <g transform="translate(500, 330)">
    <rect x="-70" y="-16" width="140" height="30" rx="6" fill="#0a1628" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" fill="#7dd3fc" text-anchor="middle">Price Oracle</text>
  </g>

  <!-- Defense legend nodes -->
  <g transform="translate(230, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">✓</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">TWAP price</text>
  </g>
  <g transform="translate(430, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">✓</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Reentrancy guard</text>
  </g>
  <g transform="translate(680, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">✓</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Slippage / timelock</text>
  </g>
  <g transform="translate(920, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">✓</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Audit / multisig</text>
  </g>
</svg>
