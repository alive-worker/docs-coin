<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why Cross-Chain Swaps Get Sandwiched on the Destination Chain cover image">
  <defs>
    <radialGradient id="dsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37e0c4" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#37e0c4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#37e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dsEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#37e0c4"/>
      <stop offset="100%" stop-color="#2fb6e0"/>
    </linearGradient>
    <linearGradient id="dsBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="dsSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dsDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#080b0c"/>
  <rect width="1200" height="600" fill="url(#dsDots)"/>

  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#37e0c4"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#080b0c" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f9a9a">Crypto Research Notes · Cross-Chain Swap Risk Check</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#37e0c4">DESTINATION FILL · CAP HIT · SANDWICH CHECK</text>

  <!-- destination-chain price candlestick with a bot's buy/sell wall sandwiching the user's fill, clamped exactly at the tolerance ceiling -->
  <g transform="translate(600,330)" filter="url(#dsSoft)">
    <circle r="220" fill="url(#dsGlow)" opacity="0.75"/>

    <!-- axis -->
    <line x1="-280" y1="90" x2="280" y2="90" stroke="#2a3838" stroke-width="2"/>
    <text x="-280" y="112" font-family="'Consolas',monospace" font-size="11" fill="#7f9a9a">Destination pool · price axis</text>

    <!-- tolerance ceiling dashed line -->
    <line x1="-280" y1="-60" x2="280" y2="-60" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 6" opacity="0.85"/>
    <text x="140" y="-70" font-family="'Consolas',monospace" font-size="12" fill="#ff9b9b" text-anchor="end">Slippage cap</text>

    <!-- attacker front-run bar (before) -->
    <rect x="-180" y="-60" width="26" height="150" fill="url(#dsBar)"/>
    <text x="-167" y="108" font-family="'Consolas',monospace" font-size="10" fill="#ff9b9b" text-anchor="middle">front-run buy</text>

    <!-- user fill, clamped at ceiling -->
    <circle cx="-20" cy="-60" r="9" fill="#37e0c4"/>
    <line x1="-20" y1="-60" x2="-20" y2="90" stroke="#37e0c4" stroke-width="2" opacity="0.5"/>
    <text x="-20" y="-76" font-family="'Consolas',monospace" font-size="11" fill="#37e0c4" text-anchor="middle">your fill</text>

    <!-- attacker back-run bar (after, sell/profit) -->
    <rect x="120" y="-30" width="26" height="120" fill="url(#dsEdge)" opacity="0.85"/>
    <text x="133" y="108" font-family="'Consolas',monospace" font-size="10" fill="#8fe9d9" text-anchor="middle">back-run sell</text>

    <!-- confirmation delay bracket -->
    <path d="M -180 150 Q -20 190 146 150" fill="none" stroke="#5c7a7a" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="-20" y="205" font-family="'Consolas',monospace" font-size="11" fill="#7f9a9a" text-anchor="middle">source confirmation delay window</text>
  </g>

  <!-- two-chain timeline strip at bottom -->
  <g transform="translate(64,520)">
    <text x="0" y="-14" font-family="'Consolas',monospace" font-size="11" fill="#7f9a9a">Source confirm</text>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#2a3838" stroke-width="3"/>
    <circle cx="20" cy="0" r="6" fill="#37e0c4"/>
    <circle cx="440" cy="0" r="6" fill="#37e0c4"/>
    <path d="M 480 0 L 560 0" stroke="#5c7a7a" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="620" y="-14" font-family="'Consolas',monospace" font-size="11" fill="#7f9a9a">Destination exec</text>
    <line x1="620" y1="0" x2="1080" y2="0" stroke="#2a3838" stroke-width="3"/>
    <circle cx="640" cy="0" r="6" fill="#ff6b6b"/>
    <circle cx="820" cy="0" r="7" fill="#37e0c4"/>
    <circle cx="1000" cy="0" r="6" fill="#ff6b6b"/>
  </g>
</svg>
