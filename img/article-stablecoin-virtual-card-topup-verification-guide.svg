<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="稳定币充值虚拟卡实操核验 主题配图">
  <defs>
    <radialGradient id="tuGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tuEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="tuSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tuDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#tuDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">稳定币充值 · 汇率对账 · 限额核验</text>

  <!-- token flowing into a card, gated by a checkmark/audit magnifier, with a rate gauge -->
  <g transform="translate(640,300)" filter="url(#tuSoft)">
    <circle r="200" fill="url(#tuGlow)" opacity="0.7"/>

    <g transform="translate(0,10)">
      <!-- stablecoin token -->
      <circle cx="-190" cy="20" r="26" fill="#111820" stroke="#5ec8e0" stroke-width="3"/>
      <text x="-190" y="26" font-family="'Consolas',monospace" font-size="14" font-weight="700" fill="#5ec8e0" text-anchor="middle">$</text>

      <path d="M -160 24 L -80 24" stroke="url(#tuEdge)" stroke-width="3" stroke-dasharray="4 8" fill="none"/>

      <!-- audit magnifier checkpoint -->
      <g transform="translate(-30,24)">
        <circle cx="-6" cy="-6" r="26" fill="#111820" stroke="#f0b64a" stroke-width="3"/>
        <path d="M -18 -6 L -10 4 L 10 -18" stroke="#f0b64a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="14" y1="14" x2="30" y2="30" stroke="#f0b64a" stroke-width="5" stroke-linecap="round"/>
      </g>

      <path d="M 8 24 L 70 24" stroke="url(#tuEdge)" stroke-width="3" fill="none"/>
      <path d="M 62 14 L 78 24 L 62 34" stroke="#4fd8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- card icon -->
      <g transform="translate(160,24)">
        <rect x="-52" y="-34" width="104" height="68" rx="10" fill="#111820" stroke="#4fd8a5" stroke-width="3"/>
        <rect x="-52" y="-16" width="104" height="14" fill="#4fd8a5" fill-opacity="0.35"/>
        <rect x="-36" y="12" width="34" height="8" rx="3" fill="#7f8aa3"/>
        <circle cx="34" cy="16" r="10" fill="none" stroke="#4fd8a5" stroke-width="3"/>
        <path d="M 28 16 L 32 20 L 41 9" stroke="#4fd8a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- rate gauge -->
    <g transform="translate(-160,-150)">
      <path d="M -30 6 A 32 32 0 0 1 30 6" stroke="#7f8aa3" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M -30 6 A 32 32 0 0 1 10 -25" stroke="#5ec8e0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="6" x2="14" y2="-16" stroke="#f0b64a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="4" fill="#f0b64a"/>
      <text x="0" y="34" font-family="'Consolas',monospace" font-size="10" fill="#7f8aa3" text-anchor="middle">实际汇率</text>
    </g>

    <rect x="-130" y="150" width="260" height="88" rx="12" fill="#111820" stroke="url(#tuEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">报价汇率 · 实际汇率</text>
      <text x="0" y="192">到账时间 · 单笔/日限额</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">对账通过再刷卡</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="40" fill="#5ec8e0">到账了，但对账了吗</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">稳定币充值虚拟卡：汇率、到账时间与限额核验</text>
</svg>
