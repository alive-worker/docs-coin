      <stop offset="55%" stop-color="#c9a479" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c9a479" stop-opacity="0"/>
    </radialGradient>
    <filter id="softgasen" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
