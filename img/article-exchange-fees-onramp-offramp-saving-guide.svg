<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="barA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#0a1628"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#38bdf8" text-anchor="middle">交易所手续费与出入金省钱</text>
  <text x="600" y="90" font-family="Arial, sans-serif" font-size="17" fill="#7dd3fc" text-anchor="middle">Exchange Fees · On/Off-Ramp · Cost Breakdown</text>

  <!-- Chart frame -->
  <line x1="150" y1="440" x2="1050" y2="440" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="440" stroke="#334155" stroke-width="2"/>
  <text x="120" y="160" font-family="monospace" font-size="12" fill="#64748b" text-anchor="end">成本 Cost</text>
  <text x="1050" y="465" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">流程 Flow →</text>

  <!-- Four cost gates as stacked bars -->
  <!-- Deposit -->
  <rect x="230" y="330" width="80" height="110" fill="url(#barB)" opacity="0.9"/>
  <text x="270" y="315" font-family="monospace" font-size="13" fill="#fbbf24" text-anchor="middle">入金</text>
  <text x="270" y="460" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Deposit</text>
  <!-- Trade -->
  <rect x="420" y="370" width="80" height="70" fill="url(#barA)" opacity="0.9"/>
  <text x="460" y="355" font-family="monospace" font-size="13" fill="#7dd3fc" text-anchor="middle">交易</text>
  <text x="460" y="460" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Trade</text>
  <!-- Withdraw -->
  <rect x="610" y="300" width="80" height="140" fill="url(#barB)" opacity="0.9"/>
  <text x="650" y="285" font-family="monospace" font-size="13" fill="#fbbf24" text-anchor="middle">提币</text>
  <text x="650" y="460" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Withdraw</text>
  <!-- Cash out -->
  <rect x="800" y="345" width="80" height="95" fill="url(#barA)" opacity="0.9"/>
  <text x="840" y="330" font-family="monospace" font-size="13" fill="#7dd3fc" text-anchor="middle">出金</text>
  <text x="840" y="460" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Cash Out</text>

  <!-- Maker/Taker mini nodes -->
  <g transform="translate(960, 200)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">M</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Maker 0.1%</text>
  </g>
  <g transform="translate(960, 240)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">T</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Taker 0.2%</text>
  </g>

  <!-- Dashed spread indicator -->
  <line x1="230" y1="330" x2="880" y2="345" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,5" opacity="0.5"/>

  <!-- Network cost legend nodes -->
  <g transform="translate(210, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">$</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">ETH 高 Gas</text>
  </g>
  <g transform="translate(430, 520)">
    <circle cx="0" cy="0" r="9" fill="#0a1628" stroke="#22c55e" stroke-width="2.5"/>
    <text x="0" y="4" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">¢</text>
    <text x="18" y="4" font-family="Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="start">Tron / L2 低费</text>
  </g>
  <g transform="translate(690, 520)">
    <rect x="-10" y="-14" width="200" height="28" rx="6" fill="#0a1628" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="5" font-family="Arial, sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">法币 / USDT / 虚拟卡</text>
  </g>

  <!-- data ticks -->
  <text x="270" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">01</text>
  <text x="460" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">02</text>
  <text x="650" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">03</text>
  <text x="840" y="560" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">04</text>
</svg>
