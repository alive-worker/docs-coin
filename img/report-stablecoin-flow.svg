<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="稳定币跨链流量报告 主题配图">
  <defs>
    <radialGradient id="sfGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37e0c4" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#37e0c4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#37e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfBar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2fb6e0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#37e0c4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sfBar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f0c674" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0c674" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="sfSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sfDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#sfDots)"/>
  <circle cx="880" cy="220" r="240" fill="url(#sfGlow)"/>

  <!-- bar chart: chain-by-chain stablecoin supply, two series -->
  <g transform="translate(140,120)" filter="url(#sfSoft)">
    <line x1="0" y1="360" x2="760" y2="360" stroke="#3a4452" stroke-width="1.5"/>
    <g>
      <rect x="20" y="80" width="46" height="280" rx="4" fill="url(#sfBar1)"/>
      <rect x="76" y="230" width="46" height="130" rx="4" fill="url(#sfBar2)"/>

      <rect x="160" y="150" width="46" height="210" rx="4" fill="url(#sfBar1)"/>
      <rect x="216" y="290" width="46" height="70" rx="4" fill="url(#sfBar2)"/>

      <rect x="300" y="300" width="46" height="60" rx="4" fill="url(#sfBar1)"/>
      <rect x="356" y="250" width="46" height="110" rx="4" fill="url(#sfBar2)"/>

      <rect x="440" y="330" width="46" height="30" rx="4" fill="url(#sfBar1)"/>
      <rect x="496" y="270" width="46" height="90" rx="4" fill="url(#sfBar2)"/>

      <rect x="580" y="335" width="46" height="25" rx="4" fill="url(#sfBar1)"/>
      <rect x="636" y="310" width="46" height="50" rx="4" fill="url(#sfBar2)"/>
    </g>
  </g>

  <text x="120" y="470" font-family="Space Grotesk, sans-serif" font-size="46" font-weight="700" fill="#f2effc">稳定币跨链流量</text>
  <text x="120" y="510" font-family="-apple-system,sans-serif" font-size="20" fill="#8fe8d8" opacity="0.85">链上供应 · 周环比变化 · 持续更新</text>
</svg>
