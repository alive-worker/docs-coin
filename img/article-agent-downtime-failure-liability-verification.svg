<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI代理宕机谁该赔：故障责任核验 主题配图">
  <defs>
    <radialGradient id="dtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dtEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#e0725e"/>
    </linearGradient>
    <filter id="dtSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dtDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#dtDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · AI×链上 系列</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">代理宕机 · 故障责任核验</text>

  <!-- flatlining heartbeat trace with a broken node-to-node link and a warning triangle -->
  <g transform="translate(600,300)" filter="url(#dtSoft)">
    <circle r="200" fill="url(#dtGlow)" opacity="0.7"/>

    <!-- two nodes with a dashed / broken connection between them -->
    <circle cx="-260" cy="-40" r="14" fill="none" stroke="#5ec8e0" stroke-width="3"/>
    <circle cx="260" cy="-40" r="14" fill="none" stroke="#7f8aa3" stroke-width="3" opacity="0.55"/>
    <line x1="-246" y1="-40" x2="-40" y2="-40" stroke="#5ec8e0" stroke-width="3" opacity="0.8"/>
    <line x1="40" y1="-40" x2="246" y2="-40" stroke="#7f8aa3" stroke-width="3" stroke-dasharray="6 10" opacity="0.5"/>
    <line x1="-18" y1="-58" x2="18" y2="-22" stroke="#e0725e" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="-58" x2="-18" y2="-22" stroke="#e0725e" stroke-width="4" stroke-linecap="round"/>

    <!-- heartbeat line flatlining into a straight line -->
    <path d="M -260 90 L -200 90 L -180 40 L -160 140 L -140 90 L -100 90 L -80 60 L -60 90 L 20 90" fill="none" stroke="#5ec8e0" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M 20 90 L 260 90" fill="none" stroke="#e0725e" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.85"/>
    <circle cx="20" cy="90" r="6" fill="#e0725e"/>

    <!-- warning triangle over a gear, denoting automation failure -->
    <g transform="translate(0,190)">
      <circle r="34" fill="none" stroke="url(#dtEdge)" stroke-width="3" opacity="0.7"/>
      <g stroke="#7f8aa3" stroke-width="3" opacity="0.6">
        <line x1="0" y1="-34" x2="0" y2="-44"/>
        <line x1="0" y1="34" x2="0" y2="44"/>
        <line x1="-34" y1="0" x2="-44" y2="0"/>
        <line x1="34" y1="0" x2="44" y2="0"/>
      </g>
      <path d="M 0 -22 L 20 16 L -20 16 Z" fill="#111820" stroke="#e0725e" stroke-width="3" stroke-linejoin="round"/>
      <text x="0" y="12" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#e0725e" text-anchor="middle">!</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="42" fill="#5ec8e0">链上自动化中断了，谁该赔</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">AI代理宕机检测与故障责任核验方法</text>
</svg>
