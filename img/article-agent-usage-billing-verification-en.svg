<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent Usage Billing Verification cover image">
  <defs>
    <radialGradient id="ubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ubeEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#8a7fd9"/>
    </linearGradient>
    <filter id="ubeSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ubeDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#ubeDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes · AI x On-Chain</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">AI SERVICE BILLING · USAGE VERIFICATION</text>

  <!-- central meter dial with usage ticks and an invoice card -->
  <g transform="translate(640,300)" filter="url(#ubeSoft)">
    <circle r="190" fill="url(#ubeGlow)" opacity="0.7"/>
    <path d="M -150 60 A 170 170 0 0 1 150 60" fill="none" stroke="url(#ubeEdge)" stroke-width="4" opacity="0.8"/>
    <g stroke="#5ec8e0" stroke-width="2" opacity="0.6">
      <line x1="-150" y1="60" x2="-160" y2="82"/>
      <line x1="-92" y1="-92" x2="-100" y2="-102"/>
      <line x1="0" y1="-140" x2="0" y2="-160"/>
      <line x1="92" y1="-92" x2="100" y2="-102"/>
      <line x1="150" y1="60" x2="160" y2="82"/>
    </g>
    <line x1="0" y1="0" x2="-70" y2="-95" stroke="#5ec8e0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="16" fill="#0c1620" stroke="#5ec8e0" stroke-width="3"/>
    <rect x="-104" y="80" width="208" height="118" rx="12" fill="#111820" stroke="url(#ubeEdge)" stroke-width="2"/>
    <text x="0" y="106" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#c9d3e0" text-anchor="middle">USAGE INVOICE</text>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="128">calls 12,482</text>
      <text x="0" y="146">tokens 3.1M</text>
      <text x="0" y="164">compute 940s</text>
    </g>
    <path d="M -104 178 H 104" stroke="#243244" stroke-width="1"/>
    <text x="0" y="194" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#5ec8e0" text-anchor="middle">? RECONCILING</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#5ec8e0">Real Usage, Accurate Bill?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Verifying metered AI agent billing</text>
</svg>
