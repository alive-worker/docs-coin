<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="链上取证与资金追踪方法论 主题配图">
  <defs>
    <radialGradient id="ofGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9db4c9" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#9db4c9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9db4c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ofEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9db4c9"/>
      <stop offset="100%" stop-color="#6f88a3"/>
    </linearGradient>
    <filter id="ofSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ofDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#ofDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#9db4c9"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#9db4c9">链上取证 · 资金追踪方法论</text>

  <!-- network graph: address clustering / fund-flow tracing -->
  <g transform="translate(640,300)" filter="url(#ofSoft)">
    <circle r="190" fill="url(#ofGlow)" opacity="0.7"/>
    <g stroke="url(#ofEdge)" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="0" x2="-176" y2="-40"/>
      <line x1="0" y1="0" x2="176" y2="-40"/>
      <line x1="0" y1="0" x2="-140" y2="130"/>
      <line x1="0" y1="0" x2="140" y2="130"/>
      <line x1="-176" y1="-40" x2="-140" y2="130" stroke-dasharray="2 6"/>
      <line x1="176" y1="-40" x2="140" y2="130" stroke-dasharray="2 6"/>
    </g>
    <path d="M0,-70 L52,-42 L52,26 C52,72 26,100 0,116 C-26,100 -52,72 -52,26 L-52,-42 Z" fill="#0c1620" stroke="#9db4c9" stroke-width="3"/>
    <text x="0" y="0" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#9db4c9" text-anchor="middle">聚类</text>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="9" fill="#7f8aa3" text-anchor="middle">CLUSTER</text>
    <g fill="#111820" stroke="url(#ofEdge)" stroke-width="2">
      <circle cx="-176" cy="-40" r="28"/>
      <circle cx="176" cy="-40" r="28"/>
      <circle cx="-140" cy="130" r="28"/>
      <circle cx="140" cy="130" r="28"/>
    </g>
    <g font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#c9d3e0" text-anchor="middle">
      <text x="-176" y="-36">地址标注</text>
      <text x="176" y="-36">混币服务</text>
      <text x="-140" y="134">跨链跳转</text>
      <text x="140" y="134">出金节点</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#9db4c9">被盗资金，去哪了</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">地址聚类、资金流向图与跨链追踪的研究方法</text>
</svg>
