<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#140e0a"/>
  <text x="72" y="110" fill="#f4eadf" font-family="Georgia, serif" font-size="52" font-weight="700">费率不是 LP 所得</text>
  <text x="72" y="162" fill="#e0b483" font-family="Georgia, serif" font-size="26">同一笔 3000，一边留 2250，一边留 2500</text>
  <rect x="72" y="210" width="480" height="250" rx="24" fill="none" stroke="#e0b483" stroke-width="3"/>
  <text x="100" y="262" fill="#c9a479" font-family="Georgia, serif" font-size="22">整笔手续费</text>
  <text x="100" y="330" fill="#f4eadf" font-family="Georgia, serif" font-size="56" font-weight="700">3000</text>
  <text x="100" y="390" fill="#8a7560" font-family="Georgia, serif" font-size="22">feeProtocol = 100</text>
  <text x="100" y="428" fill="#8a7560" font-family="Georgia, serif" font-size="22">低 4 位是 4，高 4 位是 6</text>
  <text x="620" y="250" fill="#c9a479" font-family="Georgia, serif" font-size="22">分母 4，LP 留下</text>
  <rect x="620" y="268" width="500" height="64" rx="16" fill="#e0b483"/>
  <text x="644" y="312" fill="#140e0a" font-family="Georgia, serif" font-size="36" font-weight="700">2250</text>
  <text x="620" y="390" fill="#c9a479" font-family="Georgia, serif" font-size="22">分母 6，LP 留下</text>
  <rect x="620" y="408" width="500" height="64" rx="16" fill="none" stroke="#e0b483" stroke-width="3"/>
  <text x="644" y="452" fill="#f4eadf" font-family="Georgia, serif" font-size="36" font-weight="700">2500</text>
  <text x="72" y="540" fill="#8a7560" font-family="Georgia, serif" font-size="22">协议分别拿走 750 和 500。页面上的 0.30% 不会写出这两个数。</text>
</svg>
