<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="USDT peg self-repair arbitrage loop: depeg, arbitrage, redeem, repeg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#081019"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123152"/><stop offset="1" stop-color="#0d2036"/>
    </linearGradient>
    <pattern id="g2" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#356" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#3fd0c0"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg2)"/>
  <rect width="1200" height="420" fill="url(#g2)"/>
  <text x="600" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#eef6ff">Self-Repair of the Peg: How Arbitrage Pulls USDT Back to $1</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(70 110)">
      <rect width="230" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#1f9d8f"/><text x="34" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#04121a">1</text>
      <text x="66" y="46" font-size="20" font-weight="700" fill="#eafcf8">Depeg</text>
      <text x="20" y="86" font-size="14.5" fill="#a9c6dd">Panic selling drags</text>
      <text x="20" y="110" font-size="14.5" fill="#a9c6dd">price to $0.98 —</text>
      <text x="20" y="134" font-size="14.5" fill="#a9c6dd">a discount gap opens</text>
    </g>
    <g transform="translate(360 110)">
      <rect width="230" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#1f9d8f"/><text x="34" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#04121a">2</text>
      <text x="66" y="46" font-size="20" font-weight="700" fill="#eafcf8">Arbitrage buy</text>
      <text x="20" y="86" font-size="14.5" fill="#a9c6dd">Traders buy the</text>
      <text x="20" y="110" font-size="14.5" fill="#a9c6dd">discounted USDT,</text>
      <text x="20" y="134" font-size="14.5" fill="#a9c6dd">betting on recovery</text>
    </g>
    <g transform="translate(650 110)">
      <rect width="230" height="150" rx="14" fill="url(#box)" stroke="#2f6f8c" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#1f9d8f"/><text x="34" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#04121a">3</text>
      <text x="66" y="46" font-size="20" font-weight="700" fill="#eafcf8">Redeem 1:1</text>
      <text x="20" y="86" font-size="14.5" fill="#a9c6dd">Verified users redeem</text>
      <text x="20" y="110" font-size="14.5" fill="#a9c6dd">with the issuer,</text>
      <text x="20" y="134" font-size="14.5" fill="#a9c6dd">getting $1 in cash</text>
    </g>
    <g transform="translate(940 110)">
      <rect width="230" height="150" rx="14" fill="url(#box)" stroke="#3fd0c0" stroke-width="2"/>
      <circle cx="34" cy="40" r="18" fill="#3fd0c0"/><text x="34" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#04121a">4</text>
      <text x="66" y="46" font-size="20" font-weight="700" fill="#eafcf8">Repeg to $1</text>
      <text x="20" y="86" font-size="14.5" fill="#a9c6dd">Buying lifts price,</text>
      <text x="20" y="110" font-size="14.5" fill="#a9c6dd">the gap narrows,</text>
      <text x="20" y="134" font-size="14.5" fill="#7fe6d5">peg holds again</text>
    </g>
  </g>

  <g stroke="#3fd0c0" stroke-width="2.5" fill="none">
    <line x1="300" y1="185" x2="356" y2="185" marker-end="url(#ar)"/>
    <line x1="590" y1="185" x2="646" y2="185" marker-end="url(#ar)"/>
    <line x1="880" y1="185" x2="936" y2="185" marker-end="url(#ar)"/>
  </g>
  <text x="600" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6f9ec0">Precondition: reserves are real and redemption stays open — otherwise the loop breaks and the depeg persists</text>
  <text x="600" y="372" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#41708a">DEPEG → ARBITRAGE → REDEEM → REPEG</text>
</svg>
