    <path d="M745 175 L745 215 L775 215" fill="none" stroke="#e08fa8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M860 130 L920 190 L980 130" fill="none" stroke="#e08fa8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10"/>
