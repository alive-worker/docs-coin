      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0e1420" stroke="#37e0c4" stroke-width="2.5" />
    </g>
    <g transform="translate(889,348)">
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0e1420" stroke="#37e0c4" stroke-width="2.5" />
