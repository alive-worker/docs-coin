    <line x1="900" y1="100" x2="1070" y2="170" stroke="#37e0c4" stroke-width="2" opacity="0.5"/>
    <line x1="709" y1="146" x2="670" y2="295" stroke="#37e0c4" stroke-width="2" opacity="0.5"/>
