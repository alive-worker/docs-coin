<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换卡在中途：源链扣了，目标链没到 主题配图">
  <defs>
    <radialGradient id="glowcrosschainzh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37e0c4" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#37e0c4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#37e0c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barcrosschainzh" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2fb6e0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#37e0c4" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softcrosschainzh" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotscrosschainzh" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
