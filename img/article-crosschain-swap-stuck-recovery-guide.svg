<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换卡在中途：源链扣了，目标链没到 主题配图">
  <defs>
    <radialGradient id="srGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="srEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#4fd8a5"/>
    </linearGradient>
    <filter id="srSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="srDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#srDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 出入金实操教程</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">卡单排查 · 状态追踪 · 假客服防范</text>

  <!-- route between two chain nodes with a stalled/blinking midpoint, magnifying glass tracing the hash -->
  <g transform="translate(640,300)" filter="url(#srSoft)">
    <circle r="200" fill="url(#srGlow)" opacity="0.7"/>

    <g transform="translate(0,-10)">
      <!-- source chain node -->
      <g transform="translate(-190,30)">
        <circle r="30" fill="#111820" stroke="#4fd8a5" stroke-width="3"/>
        <path d="M -10 4 L -2 12 L 12 -8" stroke="#4fd8a5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="0" y="52" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">源链已确认</text>
      </g>

      <path d="M -160 30 L -46 30" stroke="url(#srEdge)" stroke-width="3" fill="none"/>

      <!-- stalled/blinking midpoint node -->
      <g transform="translate(-10,30)">
        <circle r="20" fill="#111820" stroke="#f0663f" stroke-width="3.5"/>
        <circle r="34" fill="none" stroke="#f0663f" stroke-width="2" opacity="0.35"/>
        <circle r="46" fill="none" stroke="#f0663f" stroke-width="1.5" opacity="0.18"/>
        <line x1="0" y1="-9" x2="0" y2="3" stroke="#f0663f" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="0" cy="10" r="1.8" fill="#f0663f"/>
        <text x="0" y="60" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">桥/中继商处理中</text>
      </g>

      <path d="M 26 30 L 140 30" stroke="#3a4258" stroke-width="3" stroke-dasharray="3 7" fill="none"/>

      <!-- destination chain node, dim / pending -->
      <g transform="translate(180,30)">
        <circle r="30" fill="#111820" stroke="#3a4258" stroke-width="3"/>
        <text x="0" y="6" font-family="'Consolas',monospace" font-size="18" fill="#7f8aa3" text-anchor="middle">?</text>
        <text x="0" y="52" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">目标链未到账</text>
      </g>

      <!-- magnifying glass tracing the stalled node -->
      <g transform="translate(-10,-58)">
        <circle r="22" fill="none" stroke="#f0b64a" stroke-width="4"/>
        <line x1="16" y1="16" x2="34" y2="34" stroke="#f0b64a" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path d="M -10 -36 L -10 4" stroke="#f0b64a" stroke-width="2" stroke-dasharray="2 5" opacity="0.6"/>
    </g>

    <rect x="-160" y="150" width="320" height="88" rx="12" fill="#111820" stroke="url(#srEdge)" stroke-width="2"/>
    <g font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">
      <text x="0" y="174">交易哈希 · 路由ID · 正常等待窗口</text>
      <text x="0" y="192">自行恢复 · 退回源链 · 警惕假客服</text>
    </g>
    <text x="0" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#5ec8e0" text-anchor="middle">先定位卡点，再决定怎么办</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#5ec8e0">源链扣了，目标链没到</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">跨链兑换卡单排查：定位卡点、正确求助、防范假客服</text>
</svg>
