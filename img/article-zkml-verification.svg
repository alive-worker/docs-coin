<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="zkML与链上模型可信执行 主题配图">
  <defs>
    <radialGradient id="zkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zkEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6f8fd9"/>
    </linearGradient>
    <linearGradient id="zkFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f8fd9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="zkSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="zkDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#zkDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#a78bfa"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · AI×链上 系列（三）</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#a78bfa">zkML · 链上模型可信执行</text>

  <!-- left: model box being compiled into a circuit -->
  <g transform="translate(170,300)" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#c9d3e0" text-anchor="middle">
    <rect x="-72" y="-64" width="144" height="128" rx="14" fill="#111820" stroke="url(#zkEdge)" stroke-width="2.5"/>
    <g stroke="#a78bfa" stroke-width="1.5" opacity="0.55">
      <line x1="-72" y1="-22" x2="72" y2="-22"/>
      <line x1="-72" y1="22" x2="72" y2="22"/>
    </g>
    <text x="0" y="-36" font-family="'Consolas',monospace" font-size="13" font-weight="700" fill="#a78bfa">model</text>
    <text x="0" y="4" font-size="11" fill="#c9d3e0">weights</text>
    <text x="0" y="46" font-size="11" fill="#7f8aa3">inference</text>
  </g>

  <!-- flow lines into circuit -->
  <g stroke="url(#zkFlow)" stroke-width="3" fill="none">
    <path d="M242 260 C 360 230 420 260 560 288"/>
    <path d="M242 300 C 380 300 420 300 560 300"/>
    <path d="M242 340 C 360 370 420 340 560 312"/>
  </g>

  <!-- central zk circuit / proof core -->
  <g transform="translate(640,300)" filter="url(#zkSoft)">
    <circle r="150" fill="url(#zkGlow)" opacity="0.7"/>
    <rect x="-72" y="-72" width="144" height="144" rx="20" fill="#150d1e" stroke="#a78bfa" stroke-width="3"/>
    <g stroke="url(#zkEdge)" stroke-width="1.4" opacity="0.8">
      <rect x="-48" y="-48" width="96" height="96" rx="6" fill="none"/>
      <line x1="-48" y1="-16" x2="48" y2="-16"/>
      <line x1="-48" y1="16" x2="48" y2="16"/>
      <line x1="-16" y1="-48" x2="-16" y2="48"/>
      <line x1="16" y1="-48" x2="16" y2="48"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="-48" cy="-48" r="5"/><circle cx="48" cy="-48" r="5"/>
      <circle cx="-48" cy="48" r="5"/><circle cx="48" cy="48" r="5"/>
      <circle cx="0" cy="0" r="7"/>
    </g>
    <text x="0" y="-92" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#a78bfa" text-anchor="middle">zk circuit</text>
  </g>

  <!-- proof token flowing out -->
  <g stroke="url(#zkFlow)" stroke-width="3" fill="none">
    <path d="M712 300 C 800 300 840 300 916 300"/>
  </g>
  <g transform="translate(990,300)">
    <rect x="-64" y="-58" width="128" height="116" rx="16" fill="#111820" stroke="url(#zkEdge)" stroke-width="2.5"/>
    <path d="M-20 2 L-6 18 L22 -16" fill="none" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-20)"/>
    <text x="0" y="18" font-family="'Consolas',monospace" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">proof</text>
    <text x="0" y="42" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3" text-anchor="middle">verify()</text>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="46" fill="#a78bfa">证明「跑了」≠证明「跑对了」</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">zkML与链上模型可信执行的边界核验</text>
</svg>
