<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="跨链兑换报价为什么会过期：排队时价格早变了 主题配图">
  <defs>
    <radialGradient id="qsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5ec8e0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#5ec8e0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5ec8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qsEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ec8e0"/>
      <stop offset="100%" stop-color="#e0a95e"/>
    </linearGradient>
    <linearGradient id="qsPrice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd8a5"/>
      <stop offset="100%" stop-color="#e0725e"/>
    </linearGradient>
    <filter id="qsSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="qsDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#qsDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#5ec8e0"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">研</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">加密货币研究 · 跨链兑换风险核验</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#5ec8e0">报价快照 · 有效期倒计时 · 到账核验</text>

  <!-- an expiring quote card with a countdown ring, next to a price line drifting away from the quoted price -->
  <g transform="translate(600,320)" filter="url(#qsSoft)">
    <circle r="220" fill="url(#qsGlow)" opacity="0.7"/>

    <g transform="translate(-190,-70)">
      <rect x="0" y="0" width="230" height="150" rx="14" fill="#12141f" stroke="#3a4258" stroke-width="2"/>
      <text x="18" y="34" font-family="'Consolas',monospace" font-size="13" fill="#7f8aa3">报价快照</text>
      <text x="18" y="70" font-family="'Consolas',monospace" font-size="26" font-weight="700" fill="#4fd8a5">9,970 USDC</text>
      <text x="18" y="98" font-family="'Consolas',monospace" font-size="11" fill="#5ec8e0">有效期 60s</text>
      <circle cx="196" cy="30" r="20" fill="none" stroke="#3a4258" stroke-width="4"/>
      <path d="M 196 30 A 20 20 0 0 1 210 12" fill="none" stroke="#e0a95e" stroke-width="4" stroke-linecap="round"/>
      <text x="196" y="35" font-family="'Consolas',monospace" font-size="11" fill="#e0a95e" text-anchor="middle">18s</text>
    </g>

    <g transform="translate(-190,120)">
      <text x="0" y="-14" font-family="'Consolas',monospace" font-size="11" fill="#7f8aa3">价格走势（延迟窗口内）</text>
      <line x1="0" y1="0" x2="380" y2="0" stroke="#3a4258" stroke-width="2"/>
      <path d="M 0 0 C 90 -6, 140 4, 200 18 S 320 46, 380 60" fill="none" stroke="url(#qsPrice)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="6" fill="#4fd8a5"/>
      <text x="0" y="20" font-family="'Consolas',monospace" font-size="10" fill="#4fd8a5" text-anchor="middle">报价</text>
      <circle cx="380" cy="60" r="6" fill="#e0725e"/>
      <text x="380" y="82" font-family="'Consolas',monospace" font-size="10" fill="#e0725e" text-anchor="middle">实际成交</text>
    </g>

    <g transform="translate(120,-40)" stroke="url(#qsEdge)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M 0 0 L 90 40"/>
      <path d="M 0 40 L 90 0"/>
    </g>
    <g transform="translate(150,10)">
      <text x="0" y="0" font-family="'Consolas',monospace" font-size="12" fill="#e0a95e">源链确认</text>
      <text x="0" y="20" font-family="'Consolas',monospace" font-size="12" fill="#e0a95e">跨链结算</text>
    </g>
  </g>

  <g transform="translate(64,540)">
    <text font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#5c6684">报价是快照，执行在延迟之后 · 仅供学习研究，不构成投资建议</text>
  </g>
</svg>
