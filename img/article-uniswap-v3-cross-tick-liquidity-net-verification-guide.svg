<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0c1424"/>
  <text x="64" y="92" fill="#d7e4f5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="700">向左穿过 200：4000 - (-1000) = 5000</text>
  <text x="64" y="146" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26">穿档流动性反转核验：向左必须对 liquidityNet 取反</text>
  
  <!-- Right crossing -->
  <rect x="64" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="94" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">向右穿过 200（涨破上界）</text>
  <text x="94" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">原符号相加：5000 + (-1000)</text>
  <text x="94" y="370" fill="#7dcea0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">= 4000</text>
  <text x="270" y="370" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22">（离开区间，流动性减少）</text>

  <!-- Left crossing -->
  <rect x="636" y="210" width="500" height="230" rx="12" fill="#132038" stroke="#253a60" stroke-width="2"/>
  <text x="666" y="255" fill="#f7d488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">向左穿过 200（跌回区间）</text>
  <text x="666" y="300" fill="#8aa0bd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">取反减去：4000 - (-1000)</text>
  <text x="666" y="370" fill="#7dcea0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="52" font-weight="700">= 5000</text>
  <text x="840" y="370" fill="#e07a7a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">（误算加号为 3000）</text>

  <text x="64" y="520" fill="#e07a7a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">⚠️ 漏掉 zeroForOne 取反会将流动性错算成 3000，偏差高达 2000</text>
</svg>