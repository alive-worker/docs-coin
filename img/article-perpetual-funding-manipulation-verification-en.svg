<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perpetual Funding Rate: Organic Signal or Gamed Snapshot? cover image">
  <defs>
    <radialGradient id="pfeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd6c8" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#4fd6c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4fd6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pfeEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd6c8"/>
      <stop offset="100%" stop-color="#4f9bd6"/>
    </linearGradient>
    <filter id="pfeSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pfeDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#0a0a0f"/>
  <rect width="1200" height="600" fill="url(#pfeDots)"/>
  <g transform="translate(64,54)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="#4fd6c8"/>
    <text x="17" y="23" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#0a0a0f" text-anchor="middle">R</text>
    <text x="44" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f8aa3">Crypto Research Notes · Perpetuals</text>
  </g>
  <text x="64" y="128" font-family="'Consolas','Segoe UI',monospace" font-size="18" letter-spacing="2" fill="#4fd6c8">FUNDING RATE MANIPULATION</text>

  <!-- a tilted scale (skewed funding), a snapshot clock with a spike right before the tick, and a hidden hand behind the spike -->
  <g transform="translate(600,300)" filter="url(#pfeSoft)">
    <circle r="210" fill="url(#pfeGlow)" opacity="0.7"/>

    <!-- left: tilted scale of justice, denoting the skewed funding balance -->
    <g transform="translate(-260,10) rotate(-16)">
      <line x1="0" y1="-70" x2="0" y2="46" stroke="#4fd6c8" stroke-width="4" stroke-linecap="round"/>
      <line x1="-58" y1="-58" x2="58" y2="-58" stroke="#4fd6c8" stroke-width="4" stroke-linecap="round"/>
      <path d="M -58 -58 L -78 -18 A 22 14 0 0 0 -38 -18 Z" fill="none" stroke="#4f9bd6" stroke-width="3"/>
      <path d="M 58 -58 L 38 -18 A 22 14 0 0 0 78 -18 Z" fill="none" stroke="#4f9bd6" stroke-width="3"/>
      <line x1="-30" y1="46" x2="30" y2="46" stroke="#4fd6c8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- faint hand pulling the scale from behind, denoting deliberate manipulation -->
    <g transform="translate(-330,86)" opacity="0.5" stroke="#e0a25e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 40 L 6 0 L 14 -22 L 22 0 L 28 -18 L 36 2 L 40 -14 L 46 6 L 50 30"/>
    </g>

    <!-- connecting trail -->
    <path d="M -170 30 C -80 44, 0 30, 40 4" fill="none" stroke="#4fd6c8" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.55"/>

    <!-- right: snapshot clock with an anomalous spike right before the tick mark -->
    <g transform="translate(220,-6)">
      <circle r="92" fill="#111820" stroke="url(#pfeEdge)" stroke-width="3"/>
      <circle r="92" fill="none" stroke="#4fd6c8" stroke-width="1.5" opacity="0.3"/>
      <path d="M -60 34 L -34 30 L -10 22 L 8 -4 L 18 -58 L 28 -6 L 46 20 L 62 30" fill="none" stroke="#e0725e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="18" cy="-58" r="5" fill="#e0725e"/>
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#4fd6c8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="0" y1="0" x2="34" y2="-14" stroke="#4fd6c8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <circle r="5" fill="#4fd6c8"/>
      <text x="0" y="118" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#e0725e" text-anchor="middle">SETTLEMENT SNAPSHOT</text>
    </g>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif" font-weight="800">
    <text x="64" y="500" font-size="38" fill="#4fd6c8">Who Games the Snapshot?</text>
  </g>
  <text x="64" y="536" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7f8aa3">Detecting deliberate funding-rate settlement manipulation</text>
</svg>
