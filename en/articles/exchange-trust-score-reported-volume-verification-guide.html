<title>Moved: Exchange Trust Score vs. Reported Volume Verification: How Much of the 24h Volume Is Real Liquidity - Crypto Research Notes</title>
<meta name="description" content="An exchange's self-reported 24-hour trading volume can legally include market-maker wash trades between related accounts and bot self-trading incentivized by zero fees. Third-party data platforms apply a Trust Score to normalize volume and strip out this fake liquidity. Using real, publicly captured CoinGecko data, this guide breaks down what a Trust Score actually measures, how large the gap between reported and normalized volume can be, and how to verify whether an exchange's score genuinely reflects its real liquidity. For research purposes only, not investment advice.">
