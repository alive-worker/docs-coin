<title>Moved: Spot-Futures Basis Trading: Where the Risk Actually Hides in a "Riskless" 20% APY - Crypto Research Notes</title>
<meta name="description" content="Buying spot while shorting an equal notional of futures to lock in the basis is often marketed as riskless arbitrage, with the annualized return printed as a clean double-digit number. But that premise only holds if both legs can be opened, held, and closed simultaneously at expected prices — an ideal case reality rarely delivers. This piece breaks down where basis-trade returns actually come from, the asymmetric liquidation risk between margin regimes, the execution-timing exposure of cross-exchange legs, and the hidden costs at rollover that the headline APY never accounts for. Not investment advice.">
