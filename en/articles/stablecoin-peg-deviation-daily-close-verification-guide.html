<title>Moved: Stablecoin Peg Deviation Verification: Daily Close or Intraday Low — Which One Is the "Depeg" Claim Using - Crypto Research Notes</title>
<meta name="description" content="When crypto media reports that a stablecoin &quot;briefly depegged,&quot; it rarely specifies whether that deviation was measured using the daily closing price or the intraday low trade price — the same stablecoin on the same day might show a daily-close deviation of only a few basis points, while an extreme intraday moment could be ten times larger, and the two methodologies describe entirely different risks. Using real 90-day daily price data for USDC and USDT pulled from CoinGecko's public API, this guide breaks down how to verify which methodology a depeg report is actually using, and why daily-close data systematically hides brief intraday depegs. For research purposes only, not investment advice.">
