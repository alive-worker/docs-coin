<title>Moved: NFT Floor Price and Market Cap Verification: How Far the Displayed Floor Is From Real Sale Prices - Crypto Research Notes</title>
<meta name="description" content="The &quot;floor price&quot; an NFT marketplace displays is the lowest current listing price in a collection, and &quot;market cap&quot; is usually just that floor price multiplied by total supply — but both metrics carry systematic interpretation traps. Floor price can be manipulated by a single tiny listing, and market cap assumes the entire collection could sell simultaneously at the floor price, an assumption that almost never holds in reality. Using real NFT data pulled from CoinGecko's public API, this guide breaks down the gap between floor price and real average sale price, and how to verify whether a collection's displayed market cap figure is meaningful. For research purposes only, not investment advice.">
