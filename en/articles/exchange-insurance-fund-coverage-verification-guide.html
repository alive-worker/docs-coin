<title>Moved: Exchange Insurance Fund Coverage: Is There Actually Enough There When Bad Debt Hits - Crypto Research Notes</title>
<meta name="description" content="Nearly every exchange offering derivatives trading advertises an 'insurance fund' that absorbs bad debt from bankrupt positions before auto-deleveraging touches profitable users. But the fund's size, funding source, replenishment mechanism, and real coverage ratio are usually mentioned in a single line on a stats page, and few users ever verify whether that pool is actually large enough for an extreme move. This piece breaks down how insurance funds work, common mistakes in judging fund size, the exchange's typical responses once a fund is exhausted, and a cross-exchange verification framework. Not investment advice.">
