<title>Moved: Exchange Asset Rehypothecation Risk: Your Coins on Deposit May Already Be Lent Out - Crypto Research Notes</title>
<meta name="description" content="Depositing crypto into an exchange's spot account looks like a simple custody arrangement, but many exchange terms of service contain an easily overlooked clause: the platform reserves the right to use user assets for lending, market-making, or other business activities. That means the balance shown in your account may not correspond to a specific batch of native assets still sitting untouched — they may already be lent out to a third party, and if the borrower runs into trouble, your withdrawal request might not be honored on time. This piece breaks down the specific wording of rehypothecation clauses, why proof of reserves can't fully rule out rehypothecation risk, and a practical method to verify whether an exchange actually rehypothecates. Not investment advice.">
