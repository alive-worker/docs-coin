<title>Moved: Cross-Chain Message Replay Verification: Who's on the Hook If the Same Message Executes Twice - Crypto Research Notes</title>
<meta name="description" content="A cross-chain protocol's core job is to deliver a message from a source chain to a destination chain and execute it exactly once — but 'exactly once' is not an automatic default; it requires a purpose-built anti-replay mechanism. If the destination contract doesn't correctly track which message identifiers it has already processed, the same cross-chain message can in theory be resubmitted and re-executed, minting or transferring assets more than once. This piece breaks down how anti-replay mechanisms are designed, common implementation flaw patterns, key details in message identifier construction, and a framework for verifying a bridge's anti-replay reliability. Not investment advice.">
