<title>Moved: Airdrop Snapshot Block Selection Verification: How Much a "Convenient" Block Can Skew Allocation - Crypto Research Notes</title>
<meta name="description" content="Nearly every airdrop announcement names a specific snapshot block height or timestamp used to decide which addresses qualify and for how much. That snapshot is usually treated as an objective, immutable on-chain fact, but a verifier rarely asks: how was this specific block height decided, was the decision process disclosed in advance, and could the project retroactively pick whichever block turns out more favorable to itself or affiliated addresses once outcomes are already known. This piece breaks down how airdrop snapshot mechanisms are designed, concrete paths for the block-selection privilege to be abused, common timeline manipulation patterns, and a framework for verifying an airdrop snapshot's fairness. Not investment advice.">
