<title>Moved: Isolated vs. Cross Margin Verification: Can One Liquidation Bleed Into Your Other Positions - Crypto Research Notes</title>
<meta name="description" content="Nearly every derivatives exchange lets users choose between 'isolated' and 'cross' margin modes, and official docs usually summarize isolated margin as containing losses to a single position without touching the rest of the account. Few users actually verify whether that claim fully holds in their exchange's specific implementation — the exact boundary of isolation, the trigger order between margin top-up mechanics and auto-deleveraging, and the actual execution sequence a risk engine follows during extreme volatility can all quietly water down what 'isolated' really means. This piece breaks down the fundamental distinction between isolated and cross margin, concrete scenarios where margin isolation can develop gaps in practice, and a framework for verifying whether an exchange's margin isolation is genuinely reliable. Not investment advice.">
