<title>Moved: Oracle Median Aggregation Verification: Is the Median Really Bulletproof If a Few Feeds Get Manipulated - Crypto Research Notes</title>
<meta name="description" content="Many oracle networks advertise using a 'median' rather than an 'average' to aggregate quotes from multiple independent nodes, because a median is statistically insensitive to extreme outliers — in theory, a single manipulated node shouldn't significantly skew the final feed. That statistical property is genuinely correct, but a verifier rarely asks the specific preconditions it depends on: how many total nodes there actually are, whether this property still holds given the real node count and distribution, and whether those 'multiple nodes' are genuinely independent at the off-chain infrastructure level. This piece breaks down the statistical principle and boundary conditions of median aggregation, several concrete scenarios that can render the 'median defense' hollow, the relationship between node count and manipulation cost, and a framework for verifying an oracle's real manipulation resistance. Not investment advice.">
