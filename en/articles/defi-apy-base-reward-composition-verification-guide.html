<meta name="description" content="The single APY number a DeFi protocol displays is usually the sum of a 'base interest rate' and a 'token reward rate,' but the two differ enormously in sustainability and real value — base interest comes from borrowers actually paying interest, while token rewards' real value depends on whether that token can hold its current market price going forward. Using real protocol yield data pulled from DefiLlama's public API, this guide breaks down how to verify each component's share of a displayed APY, and the hidden risk in the token-reward portion. For research purposes only, not investment advice.">
