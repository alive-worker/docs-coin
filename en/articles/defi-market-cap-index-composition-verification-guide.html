<title>Moved: DeFi Sector Market Cap Verification: This Index Can Be Dominated by a Single Token - Crypto Research Notes</title>
<meta name="description" content="When crypto media reports that &quot;DeFi sector market cap rose X% today,&quot; it's easy to assume this reflects broad-based activity across the entire DeFi ecosystem — but this so-called &quot;DeFi sector market cap&quot; is really just a weighted index a data platform sums up based on some token categorization standard, and that index's weight distribution can be highly concentrated. If a single token accounts for over a fifth of the index's weight, that token's own price move alone is mathematically enough to dominate the entire &quot;sector's&quot; direction, with little relation to the real performance of the other hundred-plus DeFi tokens. Using real DeFi sector market cap composition data pulled from CoinGecko's public API, this guide breaks down how to verify the real weight concentration behind a &quot;DeFi sector&quot; move. For research purposes only, not investment advice.">
