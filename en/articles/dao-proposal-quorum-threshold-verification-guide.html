<title>Moved: DAO Proposal Quorum Verification: Over 60% of Proposals Have No Quorum Threshold Set At All - Crypto Research Notes</title>
<meta name="description" content="When crypto media reports that &quot;a DAO proposal passed with an overwhelming majority,&quot; it rarely mentions whether that proposal had a quorum threshold set at all, and rarely distinguishes between vote count (how many wallets voted) and weighted score total (scores_total, a token-holding-weighted figure) — two entirely different numbers. A proposal with just 3 wallets voting can legally pass and execute if there's no quorum constraint, while the tens of millions or billions in &quot;weighted score&quot; shown in coverage may simply be the token holdings of a handful of whale wallets converted into a number. Using real DAO proposal data pulled from Snapshot's public API, this guide breaks down how to verify the real participation threshold and vote count behind a &quot;passed with an overwhelming majority&quot; claim. For research purposes only, not investment advice.">
