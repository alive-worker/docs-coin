<meta name="description" content="Exchange perpetual futures pages advertise a single 'max leverage' figure, but the actual usable leverage and maintenance margin rate (MMR) step up and down through tiers as position notional value grows — cross one tier threshold and max leverage drops while MMR rises instantly. Many traders only discover this after a partial liquidation. This guide uses a real tier table to build a verification method: reading the tier structure, computing the margin gap at a tier crossing, and checking whether the exchange reserves the right to adjust tiers. For research purposes only, not investment advice.">
